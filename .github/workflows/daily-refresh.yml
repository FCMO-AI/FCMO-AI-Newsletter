name: Refresh the autonomous newsroom from the sanitized corpus

# ARB deja exclusivamente material saneado en corpus/. Desde aqui Newsletter
# funciona como redaccion publica clean-room: valida el heartbeat, ingiere,
# incorpora las ediciones ES/ZH ya escritas por el agente editorial de ARB,
# vuelve a investigar fuentes publicas, resuelve media, construye Story surfaces
# y no publica hasta que todas las compuertas pasan.
on:
  push:
    branches: [main]
    paths:
      - 'corpus/**'
      - 'tools/ingest_corpus.py'
      - 'tools/sync_airlocked_locales.py'
      - 'tools/reconcile_locale_overlays.py'
      - 'tools/validate_localizations.py'
      - 'tools/public_research_desk.py'
      - 'tools/visual_desk.py'
      - 'tools/build_newsroom_surfaces.py'
      - 'tools/build_editorial_frontends.py'
      - 'tools/finalize_editorial_frontends.py'
      - 'tools/newsroom_receipt.py'
      - '.github/workflows/daily-refresh.yml'
  schedule:
    - cron: '30 12 * * *'   # 06:30 America/Mexico_City, media hora despues de la esclusa
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsletter-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require a fresh authenticated airlock heartbeat
        id: airlock
        shell: bash
        run: |
          # Footnote: "no corpus" used to be a green no-op. That made upstream
          # starvation indistinguishable from a healthy quiet news day. A fresh
          # heartbeat with the same content digest is now the only valid
          # NO_PUBLIC_DELTA state; absent or stale input is an operational red.
          python tools/newsroom_receipt.py preflight --github-output "$GITHUB_OUTPUT"

      - name: Regenerate the canonical public source from the corpus
        run: python tools/ingest_corpus.py --corpus corpus --out release-src

      - name: Prove the ingest carried every story across
        shell: python
        run: |
          # Un generador que copia el sitio de ayer puede salir 0 y producir lo
          # mismo para siempre. Comparar identidades rompe ese falso verde.
          import json, re, sys
          from pathlib import Path
          filas = [json.loads(l) for l in
                   Path('corpus/data/developments.jsonl').read_text(encoding='utf-8').splitlines()
                   if l.strip()]
          entrada = {f['id'] for f in filas}
          html = Path('release-src/index.html').read_text(encoding='utf-8')
          m = re.search(r'<script id="fcmo-data" type="application/json">(.*?)</script>', html, re.S)
          if not m:
              sys.exit('release-src/index.html quedo sin el corpus canonico fcmo-data')
          salida = {r['id'] for r in json.loads(m.group(1))['records']}
          if entrada != salida:
              print(f'el corpus trae {len(entrada)} historias y el sitio {len(salida)}', file=sys.stderr)
              for etiqueta, faltan in (('no llegaron', entrada - salida), ('sobran', salida - entrada)):
                  if faltan:
                      print(f'  {etiqueta}: {sorted(faltan)}', file=sys.stderr)
              raise SystemExit(1)
          print(f'las {len(entrada)} historias del corpus estan en el sitio')

      - name: Import ARB-authored Spanish and Chinese editions
        run: python tools/sync_airlocked_locales.py --corpus corpus

      - name: Reconcile locale overlays with the declassified public schema
        run: python tools/reconcile_locale_overlays.py --site release-src

      - name: Prove all three editorial editions are publication-safe
        run: python tools/validate_localizations.py --site release-src

      - name: Re-research the stories from public evidence only
        run: python tools/public_research_desk.py --release-src release-src

      - name: Resolve licensed visuals or generate original FCMO explainers
        run: python tools/visual_desk.py --release-src release-src --site site

      - name: Build the Story layer and static EN ES ZH news surfaces
        run: python tools/build_newsroom_surfaces.py --release-src release-src --site site

      - name: Build and finalize the complete editorial frontend suite
        run: |
          python tools/build_editorial_frontends.py --site site
          python tools/finalize_editorial_frontends.py --site site

      - name: Write downstream newsroom acknowledgement
        run: python tools/newsroom_receipt.py finalize

      - name: Rebuild the frozen canonical overlay
        run: python tools/build_final_release.py

      - name: Rebuild the readiness receipt
        run: python tools/build_ready_receipt.py

      - name: Run the established six publication gates
        run: python tools/verify_release.py

      - name: Commit only what the autonomous newsroom produced
        shell: bash
        run: |
          git config user.name 'FCMO Autonomous Newsroom'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf publish regression
          # The readiness receipt, Story surfaces, public research receipts, media
          # provenance and locale-integrity receipts are publication products.
          # Footnote: no model credential is needed here; editorial language work
          # crossed the airlock together with the English source material.
          git add -A -- release-src release-overlay site READY_TO_PUBLISH.md
          if git diff --cached --quiet; then
            echo 'Heartbeat sano y sin delta material; el arbol ya representa esta corrida.'
            exit 0
          fi
          fuera=":!release-src :!release-overlay :!site :!READY_TO_PUBLISH.md"
          if ! git diff --cached --quiet -- $fuera; then
            echo 'la redaccion autonoma toco algo fuera de su alcance' >&2
            git diff --cached --name-only -- $fuera >&2
            exit 1
          fi
          git commit -m 'release: autonomously refresh newsroom from airlocked corpus'
          git push origin HEAD:main
