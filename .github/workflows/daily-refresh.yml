name: Refresh the autonomous newsroom from the sanitized corpus

# The newswire bridge leaves exclusively sanitized material in corpus/. From here
# Newsletter behaves as a public clean-room newsroom: read the wire status,
# ingest, import ARB-authored ES/ZH editions, re-research public sources,
# resolve media, build Story surfaces and refuse unsafe publication.
# Liveness comes from corpus/wire-status.json, never from the Airlock time. The
# preflight picks one of two paths:
# - rebuild: the release, the corpus digest or the builder changed. A builder
#   change always rebuilds, even with a delayed or down upstream (warning only).
# - status: nothing material changed; only site/data/newsroom-status.json is
#   refreshed (edition state for the reader banner), at most every 5h when idle.
# Every bridge run (success or failure) chains here, so a failing transport
# reaches the reader as a DELAYED banner. Workflow changes self-trigger a refresh.
# Native-language backlog is explicit and observable; it no longer rolls
# canonical English backward.
on:
  push:
    branches: [main]
    paths:
      - 'corpus/**'
      # The hourly heartbeat reaches this workflow through workflow_run.
      - '!corpus/wire-status.json'
      - 'scaffold/**'
      # Trigger broadly on public tooling and let newsroom_receipt.builder_digest
      # decide whether the changed tool is product-affecting. This avoids a second
      # hand-maintained trigger allowlist drifting away from BUILDER_INPUTS.
      - 'tools/**'
      - '.github/workflows/daily-refresh.yml'
  workflow_run:
    workflows:
      - 'Pull airlocked newswire with GitHub App'
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      drill_now_offset_h:
        description: 'Preview only: render the edition banner as if this many hours had passed (no commit, no deploy)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  # GitHub evaluates concurrency before job-level if:. A run chained from a
  # failed bridge (it only records the edition state) and a preview drill get a
  # unique lease, so neither can cancel a valid push/success rebuild.
  group: newsletter-refresh-v3-${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' || github.event_name == 'workflow_dispatch' && inputs.drill_now_offset_h != '') && github.run_id || 'active' }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'workflow_dispatch' || inputs.drill_now_offset_h == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Read the wire status and choose rebuild or status-only
        id: preflight
        shell: bash
        run: |
          set +e
          python tools/newsroom_receipt.py preflight --github-output "$GITHUB_OUTPUT"
          rc=$?
          set -e
          if test "$rc" -gt 1; then exit "$rc"; fi
          if test "$rc" -eq 1; then
            # TRANSPORT_DOWN: still record the edition state so readers see a
            # delayed banner. newsroom-health owns the alarm; failing here would
            # also block the Pages deploy that carries the banner.
            echo '::warning::Wire transport is down; recording the delayed edition state.'
          fi

      - name: Regenerate the canonical public source from the corpus
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/ingest_corpus.py --corpus corpus --out release-src

      - name: Bind relationship JSON and JSONL to one canonical sequence
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/synchronize_relationship_surfaces.py --site release-src

      - name: Prove the ingest carried every story across
        if: steps.preflight.outputs.path == 'rebuild'
        shell: python
        run: |
          import json, re, sys
          from pathlib import Path
          rows = [json.loads(line) for line in
                  Path('corpus/data/developments.jsonl').read_text(encoding='utf-8').splitlines()
                  if line.strip()]
          incoming = {row['id'] for row in rows}
          html = Path('release-src/index.html').read_text(encoding='utf-8')
          match = re.search(r'<script id="fcmo-data" type="application/json">(.*?)</script>', html, re.S)
          if not match:
              sys.exit('release-src/index.html is missing canonical fcmo-data')
          outgoing = {row['id'] for row in json.loads(match.group(1))['records']}
          if incoming != outgoing:
              print(f'corpus has {len(incoming)} stories and site has {len(outgoing)}', file=sys.stderr)
              for label, missing in (('did not arrive', incoming - outgoing), ('unexpected extras', outgoing - incoming)):
                  if missing:
                      print(f'  {label}: {sorted(missing)}', file=sys.stderr)
              raise SystemExit(1)
          print(f'all {len(incoming)} corpus stories reached the site')

      - name: Import ARB-authored Spanish and Chinese editions
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/sync_airlocked_locales.py --corpus corpus

      - name: Reconcile locale overlays with the declassified public schema
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/reconcile_locale_overlays.py --site release-src

      - name: Bind locale metadata to the current canonical editorial identity
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/refresh_locale_identity.py --site release-src

      - name: Validate every available native edition and record translation backlog
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/validate_localizations_partial.py --site release-src

      - name: Re-research the stories from public evidence only
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/public_research_desk.py --release-src release-src

      - name: Resolve licensed visuals or generate original FCMO explainers
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/visual_desk.py --release-src release-src --site site

      - name: Build the Story layer and static EN ES ZH news surfaces
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/build_newsroom_surfaces.py --release-src release-src --site site

      - name: Replace untranslated locale fallbacks with explicit pending pages
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/mark_pending_localizations.py --site site

      - name: Select the freshest material lead without changing evidence labels
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/editorial_freshness.py select --stories site/data/stories.json

      - name: Promote the current Story lead onto the reader front page
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/promote_story_front_page.py --site site

      - name: Build and finalize the complete editorial frontend suite
        if: steps.preflight.outputs.path == 'rebuild'
        run: |
          python tools/build_editorial_frontends.py --site site
          python tools/finalize_editorial_frontends.py --site site

      - name: Prove the complete regenerated newsroom under all stateful refresh oracles
        if: steps.preflight.outputs.path == 'rebuild'
        run: |
          python tests/oraculos/verificar_generador_newsroom.py
          python tests/oraculos/verificar_traduccion.py
          python tests/oraculos/verificar_refresco.py

      - name: Write downstream newsroom acknowledgement
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/newsroom_receipt.py finalize --wire-status corpus/wire-status.json

      - name: Rebuild the frozen canonical overlay
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/build_final_release.py

      - name: Rebuild the readiness receipt
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/build_ready_receipt.py

      - name: Run the established six publication gates
        if: steps.preflight.outputs.path == 'rebuild'
        run: python tools/verify_release.py

      - name: Record only the edition state (no material change)
        if: steps.preflight.outputs.path == 'status'
        run: python tools/newsroom_receipt.py status --wire-status corpus/wire-status.json

      - name: Commit only what the autonomous newsroom produced
        if: steps.preflight.outputs.path == 'rebuild' || steps.preflight.outputs.path == 'status'
        env:
          REFRESH_PATH: ${{ steps.preflight.outputs.path }}
        shell: bash
        run: |
          git config user.name 'FCMO Autonomous Newsroom'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf publish regression
          git add -A -- release-src release-overlay site READY_TO_PUBLISH.md
          if git diff --cached --quiet; then
            echo 'Healthy heartbeat with no material release-tree delta.'
            exit 0
          fi
          outside=":!release-src :!release-overlay :!site :!READY_TO_PUBLISH.md"
          if ! git diff --cached --quiet -- $outside; then
            echo 'autonomous newsroom touched a path outside its scope' >&2
            git diff --cached --name-only -- $outside >&2
            exit 1
          fi
          if test "$REFRESH_PATH" = status; then
            git commit -m 'status: record the newsroom edition state'
          else
            git commit -m 'release: autonomously refresh newsroom from airlocked corpus'
          fi
          BUILD_BASE="$(git rev-parse HEAD^)"

          # Optimistic publication transaction. The generated release is valid
          # only for the exact product inputs it was built from. If any corpus,
          # scaffold, tool or refresh-workflow input advances, discard this build:
          # that newer push owns the rebuild. Orthogonal changes may be rebased,
          # and a final push race retries from newest main. Never force-push.
          pushed=0
          for attempt in 1 2 3 4 5; do
            echo "Newsroom promotion attempt $attempt/5"
            git fetch --quiet origin main
            REMOTE_SHA="$(git rev-parse origin/main)"
            if test "$REMOTE_SHA" != "$(git rev-parse HEAD^)"; then
              # The wire heartbeat alone never invalidates a build.
              if ! git diff --quiet "$BUILD_BASE..$REMOTE_SHA" -- corpus scaffold tools .github/workflows/daily-refresh.yml ':!corpus/wire-status.json'; then
                echo 'Refresh was superseded by newer product inputs; discard this generated release and let the newer trigger rebuild.'
                exit 0
              fi
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'Refresh collided with newer generated/shared state; leaving reconciliation to the newer trigger.'
                exit 0
              fi
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo 'Public main advanced during newsroom promotion; retrying from newest main.' >&2
          done
          if test "$pushed" -ne 1; then
            echo 'Newsroom promotion did not converge after 5 optimistic retries; refusing force-push.' >&2
            exit 1
          fi

  # Safefail drill S2: shows what readers would get after N more hours without a
  # bridge run. Works on a copy of site/, never commits and never deploys.
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.drill_now_offset_h != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Render the edition banner at the shifted clock on a site copy
        env:
          OFFSET_H: ${{ inputs.drill_now_offset_h }}
        shell: bash
        run: |
          set -euo pipefail
          case "$OFFSET_H" in
            ''|*[!0-9]*) echo 'drill_now_offset_h must be a whole number of hours' >&2; exit 2 ;;
          esac
          FCMO_NOW=$(python -c 'import datetime as d,sys;print((d.datetime.now(d.timezone.utc)+d.timedelta(hours=int(sys.argv[1]))).strftime("%Y-%m-%dT%H:%M:%SZ"))' "$OFFSET_H")
          export FCMO_NOW
          echo "Preview clock: $FCMO_NOW (+${OFFSET_H}h)"
          PREVIEW="$RUNNER_TEMP/edition-preview"
          mkdir -p "$PREVIEW/data"
          cp -a site "$RUNNER_TEMP/edition-preview-site"
          python tools/wire_status.py classify --wire-status corpus/wire-status.json || true
          python tools/newsroom_receipt.py status --wire-status corpus/wire-status.json --status "$RUNNER_TEMP/edition-preview-site/data/newsroom-status.json"
          python tools/edition_banner.py --site "$RUNNER_TEMP/edition-preview-site"
          cp "$RUNNER_TEMP/edition-preview-site/index.html" "$PREVIEW/index.html"
          cp -a "$RUNNER_TEMP/edition-preview-site/news" "$PREVIEW/news"
          cp "$RUNNER_TEMP/edition-preview-site/data/newsroom-status.json" "$PREVIEW/data/newsroom-status.json"

      - name: Upload the banner preview
        uses: actions/upload-artifact@v6
        with:
          name: edition-preview
          path: ${{ runner.temp }}/edition-preview/
          retention-days: 7
