name: Author complete curated localization

on:
  push:
    branches:
      - 'prelaunch/i18n-full-generation'

permissions:
  contents: write
  models: read

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble exact frozen canonical release
        run: |
          rm -rf publish
          cp -a site publish
          python tools/apply_final_release.py publish

      - name: Generate source-controlled ES/ZH full-dossier candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FCMO_I18N_AUTHOR_MODEL: openai/gpt-4.1
        run: python tools/generate_full_curated_i18n.py

      - name: Validate generated JSON and commit authoring artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for locale in ('es-419','zh-Hans'):
              root=Path('site/data/i18n')/locale
              details={}
              for path in sorted(root.glob('detail-*.json')):
                  data=json.loads(path.read_text(encoding='utf-8'))
                  assert data['schema']=='fcmo-curated-detail-part-v1'
                  assert data['locale']==locale
                  overlap=set(details)&set(data['records'])
                  assert not overlap, overlap
                  details.update(data['records'])
              assert len(details)==22, (locale,len(details))
              extra=json.loads((root/'ui-extra.json').read_text(encoding='utf-8'))
              assert extra['locale']==locale and len(extra['ui'])>=50
              print(locale, 'full dossiers', len(details), 'UI phrases', len(extra['ui']))
          PY
          git config user.name "FCMO localization author"
          git config user.email "magyarmex.github@gmail.com"
          git add site/data/i18n/es-419 site/data/i18n/zh-Hans
          if ! git diff --cached --quiet; then
            git commit -m "Author complete curated Spanish and Chinese public copy"
            git push
          fi
