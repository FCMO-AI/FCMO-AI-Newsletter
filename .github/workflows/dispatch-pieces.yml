name: Dispatch FCMO pieces by email

on:
  workflow_run:
    workflows: ["Deploy FCMO AI Newsletter"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '45 13 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Kit only: private seed tags and separate piece intents/records'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: fcmo-daily-email
  cancel-in-progress: false

env:
  FCMO_EMAIL_PROVIDER: ${{ vars.FCMO_EMAIL_PROVIDER || 'kit' }}
  FCMO_EMAIL_ENABLED: ${{ vars.FCMO_EMAIL_ENABLED }}
  FCMO_EMAIL_PUBLIC_URL: ${{ vars.FCMO_EMAIL_PUBLIC_URL }}
  FCMO_EMAIL_COMPLIANCE_READY: ${{ vars.FCMO_EMAIL_COMPLIANCE_READY }}
  FCMO_EMAIL_FROM: ${{ vars.FCMO_EMAIL_FROM }}
  KIT_FORM_EN: ${{ vars.KIT_FORM_EN }}
  KIT_FORM_ES: ${{ vars.KIT_FORM_ES }}
  KIT_FORM_ZH: ${{ vars.KIT_FORM_ZH }}
  KIT_TEST_SUBSCRIBER_ID: ${{ vars.KIT_TEST_SUBSCRIBER_ID }}
  FCMO_EMAIL_NAMESPACE: ${{ inputs.test_mode && 'fcmo-diario-test' || 'fcmo-diario' }}
  KIT_TAG_EN: ${{ inputs.test_mode && vars.KIT_TEST_TAG_EN || (!inputs.test_mode && vars.KIT_TAG_EN || '') }}
  KIT_TAG_ES: ${{ inputs.test_mode && vars.KIT_TEST_TAG_ES || (!inputs.test_mode && vars.KIT_TAG_ES || '') }}
  KIT_TAG_ZH: ${{ inputs.test_mode && vars.KIT_TEST_TAG_ZH || (!inputs.test_mode && vars.KIT_TAG_ZH || '') }}


jobs:
  dispatch:
    if: >-
      vars.FCMO_EMAIL_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controls and the live-verified LKG tag
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refuse seed mode without Kit seed configuration
        if: inputs.test_mode && env.FCMO_EMAIL_PROVIDER != 'kit'
        run: exit 1
      - name: Prove opted-in piece documents and web versions on verified Pages
        shell: bash
        run: |
          set -euo pipefail
          LKG_COMMIT="$(git rev-parse --verify 'refs/tags/lkg^{commit}')"
          python tools/email_piece_dispatch.py --collect --lkg-commit "$LKG_COMMIT" \
            --bundle "$RUNNER_TEMP/email-pieces.json"
      - name: Restore lifetime intents and reserve keys before sending
        env:
          GH_TOKEN: ${{ github.token }}
          FCMO_EMAIL_PROVIDER_CONFIG: ${{ secrets.FCMO_EMAIL_PROVIDER_CONFIG }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          FCMO_EMAIL_DISPATCH_TOKEN: ${{ secrets.FCMO_EMAIL_DISPATCH_TOKEN }}
          FCMO_EMAIL_POSTAL_ADDRESS: ${{ secrets.FCMO_EMAIL_POSTAL_ADDRESS }}
        run: >-
          python tools/email_piece_dispatch.py --claim
          --bundle "$RUNNER_TEMP/email-pieces.json"
          --intent "$RUNNER_TEMP/email-intent.json"
          --state "$RUNNER_TEMP/email-piece-state.json"
      - name: Persist the L27 write-ahead intent artifact before provider mutation
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.test_mode && 'piece-email-test-intent' || 'piece-email-intent' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/email-intent.json
          if-no-files-found: error
          retention-days: 90
      - name: Send reviewed locales and persist public observations
        env:
          GH_TOKEN: ${{ github.token }}
          FCMO_EMAIL_PROVIDER_CONFIG: ${{ secrets.FCMO_EMAIL_PROVIDER_CONFIG }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          FCMO_EMAIL_DISPATCH_TOKEN: ${{ secrets.FCMO_EMAIL_DISPATCH_TOKEN }}
          FCMO_EMAIL_POSTAL_ADDRESS: ${{ secrets.FCMO_EMAIL_POSTAL_ADDRESS }}
        run: >-
          python tools/email_piece_dispatch.py --send
          --bundle "$RUNNER_TEMP/email-pieces.json"
          --intent "$RUNNER_TEMP/email-intent.json"
          --state "$RUNNER_TEMP/email-piece-state.json"
