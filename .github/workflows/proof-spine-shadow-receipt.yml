name: Proof Spine shadow receipt

on:
  push:
    branches:
      - agent/proof-spine-shadow-pilot
    paths:
      - 'tools/proof_spine_shadow_receipt.py'
      - 'docs/PROOF_SPINE_SHADOW_PILOT.md'
      - '.github/workflows/proof-spine-shadow-receipt.yml'
  workflow_dispatch:
  # Footnote: workflow_run events use the workflow definition on the default branch.
  # They are intentionally dormant while this experiment remains an unmerged PR, but
  # if the evidence adapter is later accepted they make observation event-driven after
  # the existing production-health/transport cycles instead of introducing another
  # blind polling cadence or silently changing either producer's behavior.
  workflow_run:
    workflows:
      - Autonomous newsroom production health
      - Pull airlocked newswire with GitHub App
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: proof-spine-shadow-receipt
  cancel-in-progress: true

jobs:
  shadow-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Footnote for future maintainers: the shadow pilot deliberately uses the same
      # read-only GitHub App boundary as production transport. It receives no write
      # permission to ARB and never uploads or preserves the private checkout.
      - name: Require the GitHub App Client ID
        env:
          APP_CLIENT_ID: ${{ vars.FCMO_NEWSWIRE_APP_CLIENT_ID }}
        shell: bash
        run: |
          test -n "$APP_CLIENT_ID" || { echo 'FCMO_NEWSWIRE_APP_CLIENT_ID is not configured' >&2; exit 1; }

      - name: Mint a read-only token scoped only to private ARB
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FCMO_NEWSWIRE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FCMO_NEWSWIRE_APP_PRIVATE_KEY }}
          owner: FCMO-AI
          repositories: AI-Research-Breakthroughs
          permission-contents: read

      - name: Reduce current ARB main to a sanitized publication witness
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/fcmo-proof-spine-arb-private"
          PUBLIC_RELEASE="$RUNNER_TEMP/fcmo-proof-spine-arb-public-release"
          SEAL_LOG="$RUNNER_TEMP/fcmo-proof-spine-arb-seal.log"
          STATE_FILE="$RUNNER_TEMP/fcmo-proof-spine-arb-seal-state"
          rm -rf "$PRIVATE_DIR" "$PUBLIC_RELEASE"
          rm -f "$SEAL_LOG" "$STATE_FILE"

          AUTH=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --quiet --depth 1 --single-branch --branch main \
            https://github.com/FCMO-AI/AI-Research-Breakthroughs.git \
            "$PRIVATE_DIR"
          unset AUTH APP_TOKEN

          # Footnote: unlike the production bridge, this witness does not fall back to
          # an older PUBLICATION_READY snapshot. Its narrow question is whether *current*
          # ARB main already has a sealable public projection that Newsletter has not yet
          # ingested. A seal failure therefore becomes UNKNOWN evidence, never a forced
          # publication or a false claim that production itself is unhealthy.
          if (
            cd "$PRIVATE_DIR" &&
            env -i \
              "PATH=$PATH" \
              "HOME=$HOME" \
              "LANG=C.UTF-8" \
              "LC_ALL=C.UTF-8" \
              "ARB_SITE_BASE_PATH=/FCMO-AI-Newsletter" \
              "ARB_PUBLIC_BASE_URL=https://fcmo-ai.github.io/FCMO-AI-Newsletter" \
              python tools/publication_seal.py
          ) >"$SEAL_LOG" 2>&1 && grep -qx 'SEAL_OK' "$SEAL_LOG"; then
            mkdir -p "$PUBLIC_RELEASE"
            cp -a "$PRIVATE_DIR/_public_release/." "$PUBLIC_RELEASE/"
            printf '%s\n' 'SEALED' > "$STATE_FILE"
          else
            printf '%s\n' 'CURRENT_MAIN_UNSEALABLE' > "$STATE_FILE"
          fi

          # Footnote: destroy private ARB state before any Newsletter-side comparison
          # or artifact creation. Only an already-sanitized release may survive this step.
          rm -rf "$PRIVATE_DIR"
          rm -f "$SEAL_LOG"
          test ! -e "$PRIVATE_DIR"
          test ! -e "$SEAL_LOG"
          test -s "$STATE_FILE"

      # Footnote for future maintainers: this workflow is an evidence adapter, not a
      # production gate. It intentionally reuses Newsletter-native checks and has
      # read-only repository permission; no publish/deploy action is reachable here.
      - name: Compile shadow receipt adapter
        run: python -m py_compile tools/proof_spine_shadow_receipt.py

      - name: Capture Newsletter-native health plus sanitized ARB synchronization witness
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_RELEASE="$RUNNER_TEMP/fcmo-proof-spine-arb-public-release"
          STATE_FILE="$RUNNER_TEMP/fcmo-proof-spine-arb-seal-state"
          UPSTREAM_STATE=$(cat "$STATE_FILE")
          if [ "$UPSTREAM_STATE" = 'SEALED' ]; then
            python tools/proof_spine_shadow_receipt.py \
              --upstream-seal-state SEALED \
              --upstream-release "$PUBLIC_RELEASE" \
              --output /tmp/newsletter-proof-spine-shadow-receipt.json
          else
            python tools/proof_spine_shadow_receipt.py \
              --upstream-seal-state "$UPSTREAM_STATE" \
              --output /tmp/newsletter-proof-spine-shadow-receipt.json
          fi
          rm -rf "$PUBLIC_RELEASE"
          rm -f "$STATE_FILE"

      # Footnote: make the observation visible in the Actions UI without turning it
      # into an enforcement result. A MATERIAL_PUBLIC_DELTA_AVAILABLE verdict is still
      # shadow evidence; this summary deliberately never exits non-zero because of it.
      - name: Summarize shadow observation
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          receipt = json.loads(Path('/tmp/newsletter-proof-spine-shadow-receipt.json').read_text(encoding='utf-8'))
          local = receipt.get('local_surface') or {}
          alignment = receipt.get('source_alignment') or {}
          upstream = receipt.get('upstream_publication') or {}
          delta = upstream.get('delta') or {}
          print('## Proof Spine shadow observation')
          print()
          print(f"- Newsletter local state: `{local.get('state')}` / `{local.get('quality_state')}`")
          print(f"- Newsletter source alignment: `{alignment.get('state')}`")
          print(f"- ARB→Newsletter material sync witness: `{upstream.get('state')}`")
          print(f"- Material public IDs in delta: `{len(delta.get('material_public_ids') or [])}`")
          print(f"- Observed at: `{receipt.get('observed_at')}`")
          print()
          print('Shadow evidence only; no publication, deploy, rollback, or release authority is created by this workflow.')
          PY

      # Footnote: preserve the raw receipt as the cross-repository evidence boundary.
      # Ninety days is intentional: natural sensitivity events can be rare, and a
      # useful receipt must not disappear before humans/agents can compare it with the
      # surrounding production history. The artifact is still observations only.
      - name: Upload shadow receipt
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-proof-spine-shadow-receipt
          path: /tmp/newsletter-proof-spine-shadow-receipt.json
          if-no-files-found: error
          retention-days: 90
