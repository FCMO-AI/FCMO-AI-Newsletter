name: Deploy FCMO AI Newsletter

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'release-overlay/final/**'
      - 'localization/**'
      - 'tools/apply_final_release.py'
      - 'tools/i18n_release.py'
      - 'I18N.md'
      - '.github/workflows/pages.yml'
  public:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'public' || github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Assemble and validate frozen canonical release
        run: |
          rm -rf publish
          cp -a site publish
          python tools/apply_final_release.py publish

      - name: Apply curated native-language publication layer
        run: |
          python -m py_compile tools/i18n_release.py
          python tools/i18n_release.py publish --source .
          python tools/i18n_release.py publish --source . --validate-only

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'public' || github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
