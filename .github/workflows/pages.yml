name: Deploy FCMO AI Newsletter

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'release-overlay/final/**'
      - 'tools/apply_final_release.py'
      - 'tools/apply_curated_i18n.py'
      - 'tools/build_editorial_frontends.py'
      - 'tools/finalize_editorial_frontends.py'
      - 'tools/verify_live_newsroom.py'
      - 'tests/oraculos/verificar_dom.py'
      - '.github/workflows/pages.yml'
  # A push made with GITHUB_TOKEN does not trigger another push workflow. Both
  # autonomous newsroom producers commit that way, so workflow_run is the
  # deliberate bridge from a successful newsroom build into Pages.
  workflow_run:
    workflows:
      - 'Refresh the autonomous newsroom from the sanitized corpus'
      - 'Bootstrap autonomous newsroom from existing public release'
    types: [completed]
    branches: [main]
  public:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Footnote: a completed-but-failed upstream producer still creates a
  # workflow_run instance. GitHub applies workflow-level concurrency before the
  # build job's success guard, so cancel-in-progress=true let a run that would
  # later be skipped cancel an already-valid push deployment. Queueing here is
  # intentional: only runs whose build guard passes can ever reach deploy.
  cancel-in-progress: false

jobs:
  build:
    # Footnote: keep the visibility gate even while public so a future visibility
    # change fails safe instead of publishing by surprise. A failed upstream
    # newsroom run also cannot enter Pages through workflow_run.
    if: >-
      github.event.repository.visibility == 'public' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prove the frozen overlay still matches its editable source
        run: python tools/build_final_release.py --check

      - name: Assemble frozen release and apply committed native locales
        run: |
          rm -rf publish
          cp -a site publish
          python tools/apply_final_release.py publish
          CANONICAL_HASH=$(python - <<'PY'
          import json
          print(json.load(open('release-overlay/final/manifest.json', encoding='utf-8'))['index_sha256'])
          PY
          )
          python tools/apply_curated_i18n.py publish "$CANONICAL_HASH"

      - name: Build discovery frontends on the exact Pages candidate
        run: |
          # Footnote: the frozen overlay intentionally owns the canonical release
          # source. Discovery pages must therefore be generated *after* it is
          # mounted; otherwise archive/search/topic pages in site/ can be silently
          # overwritten by their older frozen counterparts during assembly.
          python tools/build_editorial_frontends.py --site publish
          python tools/finalize_editorial_frontends.py --site publish --refresh-manifest

      - name: Render runtime contracts in a real browser
        run: python tests/oraculos/verificar_dom.py publish

      - name: Prove the public receipt matches the assembled tree
        run: python tools/build_ready_receipt.py --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish

  deploy:
    if: github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-oracle:
    name: prove the deployed newspaper is actually live
    if: github.event.repository.visibility == 'public'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify production origin, release identity and public route suite
        run: python tools/verify_live_newsroom.py --allow-unbootstrapped
