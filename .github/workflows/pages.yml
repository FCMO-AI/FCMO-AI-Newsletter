name: Deploy FCMO AI Newsletter

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'release-overlay/final/**'
      - 'tools/apply_final_release.py'
      - 'tools/apply_curated_i18n.py'
      - '.github/workflows/pages.yml'
  # Un push hecho con GITHUB_TOKEN no dispara otros workflows, asi que el commit
  # del refresco diario nunca llegaria a Pages por la via de `push`. Este gancho
  # es la que la documentacion de GitHub senala para ese caso.
  workflow_run:
    workflows: ['Refresh the newsletter from the sanitized corpus']
    types: [completed]
    branches: [main]
  public:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Keep the private repository prelaunch-safe. The same workflow fires again
    # automatically when GitHub emits the `public` event after visibility changes.
    # Un refresco que fallo no se despliega: la segunda condicion solo mira el
    # resultado cuando el disparador fue `workflow_run`.
    if: >-
      github.event.repository.visibility == 'public' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prove the frozen overlay still matches its editable source
        run: python tools/build_final_release.py --check

      - name: Assemble frozen English release and apply curated locales
        run: |
          rm -rf publish
          cp -a site publish
          python tools/apply_final_release.py publish
          CANONICAL_HASH=$(python - <<'PY'
          import json
          print(json.load(open('release-overlay/final/manifest.json', encoding='utf-8'))['index_sha256'])
          PY
          )
          python tools/apply_curated_i18n.py publish "$CANONICAL_HASH"

      - name: Prove the public receipt matches the assembled tree
        run: python tools/build_ready_receipt.py --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish

  deploy:
    if: github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
