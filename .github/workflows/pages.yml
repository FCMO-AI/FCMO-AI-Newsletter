name: Deploy FCMO AI Newsletter

on:
  push:
    branches: [main]
    paths:
      - 'site/data/stories.v2.json'
      - 'site/data/newsroom-status.json'
      - 'site-src/**'
      - 'editorial/**'
      - 'config/site.json'
      - 'design/**'
      - 'i18n/**'
      - 'tools/paper/**'
      - 'tools/email_providers/**'
      - 'legal/email-privacy*.json'
      - 'tools/gates/**'
      - 'tools/build_deployment_identity.py'
      - 'tools/verify_live_front_page.py'
      - 'tests/oraculos/verificar_paper.py'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Refresh the autonomous newsroom from the sanitized corpus']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'deploy builds main; rollback rebuilds and deploys the live-verified lkg tag'
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One lease ('active') serialises every run that can write Pages: there is
  # never more than one writer, and GitHub keeps at most one *pending* run per
  # group, replacing an older pending run with the newer one.
  #
  # Automatic triggers (push, refresh workflow_run, schedule) QUEUE instead of
  # cancelling. With cancel-in-progress the in-flight candidate was cancelled
  # by every refresh; refreshes land every 30-60 min and a build took 45-130
  # min, so from 2026-10-11 14:50Z no run reached deploy for days (PR text has
  # the run ids). Queueing keeps the old guarantees without the starvation:
  # runs execute in creation order, each run builds the main head current
  # when it was created, so a later Pages write is always from a newer (or the
  # same) commit; a stale candidate can never overwrite a newer one, and the
  # newest pending run always deploys after the one in flight.
  #
  # A manual dispatch on main (deploy or rollback) still pre-empts whatever is
  # in flight, so a rollback is never stuck behind a candidate. An automatic
  # run that arrives during a rollback now waits for it instead of cancelling
  # it.
  #
  # Failed upstream notifications and non-main dispatches get their own group
  # and can neither cancel nor queue behind a real run; a non-main dispatch
  # runs only the regression shards (no build, no Pages write).
  group: github-pages-v4-${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' || github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') && github.run_id || 'active' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  FCMO_REQUIRE_BROWSER: '1'
  BASE_PATH: /FCMO-AI-Newsletter/
  PUBLIC_ORIGIN: https://fcmo-ai.github.io/FCMO-AI-Newsletter/
  FCMO_EMAIL_ENABLED: ${{ vars.FCMO_EMAIL_ENABLED == 'true' && 'true' || 'false' }}
  FCMO_EMAIL_PROVIDER: ${{ vars.FCMO_EMAIL_PROVIDER || 'kit' }}
  FCMO_EMAIL_PUBLIC_URL: ${{ vars.FCMO_EMAIL_PUBLIC_URL }}
  FCMO_EMAIL_PUBLIC_CONFIG: ${{ vars.FCMO_EMAIL_PUBLIC_CONFIG }}
  FCMO_EMAIL_COMPLIANCE_READY: ${{ vars.FCMO_EMAIL_COMPLIANCE_READY }}
  FCMO_EMAIL_PRIVACY_URL: ${{ vars.FCMO_EMAIL_PRIVACY_URL }}
  KIT_FORM_EN: ${{ vars.KIT_FORM_EN }}
  KIT_FORM_ES: ${{ vars.KIT_FORM_ES }}
  KIT_FORM_ZH: ${{ vars.KIT_FORM_ZH }}
  KIT_FORM_UID_EN: ${{ vars.KIT_FORM_UID_EN }}
  KIT_FORM_UID_ES: ${{ vars.KIT_FORM_UID_ES }}
  KIT_FORM_UID_ZH: ${{ vars.KIT_FORM_UID_ZH }}

jobs:
  regression:
    # The full regression suite, unchanged, split into parallel shards
    # (tools/unittest_shards.py): every discovered test runs in exactly one
    # shard, whole classes stay together, and a shard refuses to run unless
    # the partition is complete. Same environment as the former serial step
    # (Playwright, axe, age, PyYAML, full history). It writes nothing.
    name: regression shard ${{ matrix.shard }} of 0-7
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      # Every shard finishes so one run reports every failing test at once.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout the exact publication input with LKG history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save playwright@1.63.0 axe-core@4.14.0
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/playwright/node_modules/playwright" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/playwright/node_modules" >> "$GITHUB_ENV"
          echo "AXE_CORE_PATH=$RUNNER_TEMP/playwright/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Install regression dependencies
        run: |
          python -m pip install PyYAML==6.0.2
          sudo apt-get update
          sudo apt-get install -y age
      - name: Run this shard of the full regression suite before publication
        run: python3 tools/unittest_shards.py --index ${{ matrix.shard }} --count 8

  build:
    needs: regression
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'workflow_dispatch' || (inputs.operation == 'deploy' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact current publication input with LKG history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a deploy until the existing live release is anchored as LKG
        run: git rev-parse --verify 'refs/tags/lkg^{commit}'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save playwright@1.63.0 axe-core@4.14.0
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/playwright/node_modules/playwright" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/playwright/node_modules" >> "$GITHUB_ENV"
          echo "AXE_CORE_PATH=$RUNNER_TEMP/playwright/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Install regression dependencies
        run: |
          python -m pip install PyYAML==6.0.2
          sudo apt-get update
          sudo apt-get install -y age

      - name: Receipt the current automated newspaper inputs before integrity checks
        run: python3 tools/build_ready_receipt.py

      - name: Preserve the established six-gate release boundary
        run: python3 tools/verify_release.py

      - name: Render locale-specific Open Graph cards
        run: >-
          python tools/paper/og_image.py
          --stories site/data/stories.v2.json
          --out "$RUNNER_TEMP/paper-og"

      - name: Build today's static newspaper from the Story layer
        run: >-
          python tools/paper/build.py
          --stories site/data/stories.v2.json
          --status site/data/newsroom-status.json
          --editorial editorial
          --out publish
          --base "$BASE_PATH"
          --og-source "$RUNNER_TEMP/paper-og"

      - name: Put the governed glossary inside the exact candidate
        run: |
          mkdir -p publish/data
          cp i18n/glossary.yml publish/data/glossary.json

      - name: Validate agent freshness, primary-source feeds, and multilingual citations
        run: python tools/validate_agent_hygiene.py --site publish

      - name: Run every deterministic publication gate before deploy
        run: python tools/gates/run_all.py publish

      - name: Run the real-browser matrix before deploy
        run: |
          export CHROME_PATH="$(node -e "console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())")"
          python tests/oraculos/verificar_paper.py publish

      - name: Bind the exact candidate to a public deployment identity
        run: >-
          python tools/build_deployment_identity.py
          --site publish
          --output publish/deployment-identity.json
          --source-commit "$(git rev-parse HEAD)"

      - name: Preserve identity independently of the Pages artifact
        uses: actions/upload-artifact@v6
        with:
          name: candidate-identity-${{ github.run_id }}
          path: publish/deployment-identity.json
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only the fully gated candidate
        uses: actions/upload-pages-artifact@v4
        with:
          name: candidate-pages-${{ github.run_id }}
          path: publish
          retention-days: 7

  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy the gated candidate
        id: pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: candidate-pages-${{ github.run_id }}

  live-verify:
    name: verify exact candidate at the public origin
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: candidate-identity-${{ github.run_id }}
          path: identity
      - name: Poll through CDN propagation, then prove identity and critical routes
        run: >-
          python tools/verify_live_front_page.py
          --expected-identity identity/deployment-identity.json
          --base-url "$PUBLIC_ORIGIN"
          --timeout-seconds 900
          --poll-seconds 15

  promote-lkg:
    name: advance LKG only after public-origin verification
    needs: live-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          name: candidate-identity-${{ github.run_id }}
          path: identity
      - name: Move the recoverable LKG tag to the verified source commit
        shell: bash
        run: |
          set -euo pipefail
          LKG_SHA="$(python -c "import json; print(json.load(open('identity/deployment-identity.json'))['source_commit'])")"
          git cat-file -e "$LKG_SHA^{commit}"
          git tag -f lkg "$LKG_SHA"
          git push --force origin refs/tags/lkg

  rollback-build:
    name: rebuild immutable LKG after a failed live verify or manual rollback
    needs: [deploy, live-verify]
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' && github.ref == 'refs/heads/main') ||
       (needs.deploy.result == 'success' &&
        (needs.live-verify.result == 'failure' || needs.live-verify.result == 'cancelled')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current recovery controls
        uses: actions/checkout@v6
        with:
          path: control
          persist-credentials: false
      - name: Checkout the live-verified LKG tag, independent of artifact retention
        uses: actions/checkout@v6
        with:
          ref: lkg
          fetch-depth: 0
          path: lkg-source
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: hashFiles('lkg-source/tools/paper/build.py') != ''
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium for paper LKG
        if: hashFiles('lkg-source/tools/paper/build.py') != ''
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save playwright@1.63.0 axe-core@4.14.0
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/playwright/node_modules/playwright" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/playwright/node_modules" >> "$GITHUB_ENV"
          echo "AXE_CORE_PATH=$RUNNER_TEMP/playwright/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Rebuild and verify LKG with its native release system
        shell: bash
        run: |
          set -euo pipefail
          LKG_SHA="$(git -C lkg-source rev-parse HEAD)"
          if test -f lkg-source/tools/paper/build.py; then
            EDITORIAL_ARGS=()
            if test -f lkg-source/tools/paper/essays.py; then
              EDITORIAL_ARGS=(--editorial lkg-source/editorial)
            fi
            python lkg-source/tools/paper/og_image.py \
              --stories lkg-source/site/data/stories.v2.json \
              --out "$RUNNER_TEMP/rollback-og"
            python lkg-source/tools/paper/build.py \
              --stories lkg-source/site/data/stories.v2.json \
              --status lkg-source/site/data/newsroom-status.json \
              "${EDITORIAL_ARGS[@]}" \
              --out rollback-publish --base "$BASE_PATH" \
              --og-source "$RUNNER_TEMP/rollback-og"
            mkdir -p rollback-publish/data
            cp lkg-source/i18n/glossary.yml rollback-publish/data/glossary.json
            python control/tools/gates/run_all.py rollback-publish
            export CHROME_PATH="$(node -e "console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())")"
            python control/tests/oraculos/verificar_paper.py rollback-publish
          else
            cp -a lkg-source/site rollback-publish
            (cd lkg-source && python tools/build_final_release.py --check)
            (cd lkg-source && python tools/apply_final_release.py ../rollback-publish)
            CANONICAL_HASH="$(python -c "import json; print(json.load(open('lkg-source/release-overlay/final/manifest.json'))['index_sha256'])")"
            (cd lkg-source && python tools/apply_curated_i18n.py ../rollback-publish "$CANONICAL_HASH")
            cp lkg-source/site/data/stories.json rollback-publish/data/stories.json
            (cd lkg-source && python tools/promote_story_front_page.py --site ../rollback-publish)
            (cd lkg-source && python tools/apply_front_page_layout.py --site ../rollback-publish)
            (cd lkg-source && python tools/build_editorial_frontends.py --site ../rollback-publish)
            (cd lkg-source && python tools/edition_banner.py --site ../rollback-publish)
            (cd lkg-source && python tools/finalize_editorial_frontends.py --site ../rollback-publish --refresh-manifest)
            (cd lkg-source && python tools/verify_release.py)
            (cd lkg-source && python tests/oraculos/verificar_dom.py ../rollback-publish)
            (cd lkg-source && python tests/oraculos/verificar_home_lead.py ../rollback-publish)
            (cd lkg-source && python tests/oraculos/verificar_layout.py ../rollback-publish)
            (cd lkg-source && python tests/oraculos/verificar_editorial_layout.py ../rollback-publish)
            (cd lkg-source && python tests/oraculos/verificar_surface_freshness.py ../rollback-publish)
          fi
          python control/tools/build_deployment_identity.py \
            --site rollback-publish --output rollback-publish/deployment-identity.json \
            --source-commit "$LKG_SHA"
      - uses: actions/upload-artifact@v6
        with:
          name: rollback-identity-${{ github.run_id }}
          path: rollback-publish/deployment-identity.json
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        with:
          name: rollback-pages-${{ github.run_id }}
          path: rollback-publish
          retention-days: 7

  rollback:
    needs: rollback-build
    if: always() && needs.rollback-build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Redeploy LKG
        id: pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: rollback-pages-${{ github.run_id }}

  rollback-verify:
    needs: rollback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: rollback-identity-${{ github.run_id }}
          path: identity
      - name: Prove the public origin is serving LKG again
        run: >-
          python tools/verify_live_front_page.py
          --expected-identity identity/deployment-identity.json
          --base-url "$PUBLIC_ORIGIN"
          --timeout-seconds 900
          --poll-seconds 15
