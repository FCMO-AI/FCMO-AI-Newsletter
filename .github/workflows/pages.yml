name: Deploy FCMO AI Newsletter

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'release-overlay/final/**'
      - 'tools/apply_final_release.py'
      - 'tools/apply_curated_i18n.py'
      - 'tests/oraculos/verificar_dom.py'
      - 'tests/oraculos/verificar_live.py'
      - '.github/workflows/pages.yml'
  # Un push hecho con GITHUB_TOKEN no dispara otros workflows, asi que el commit
  # del refresco diario nunca llegaria a Pages por la via de `push`. Este gancho
  # es la que la documentacion de GitHub senala para ese caso.
  workflow_run:
    workflows: ['Refresh the newsletter from the sanitized corpus']
    types: [completed]
    branches: [main]
  public:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Footnote: the repository is public today, but keeping the visibility gate
    # makes a future visibility change safe by default rather than deploy-by-surprise.
    # A failed daily refresh also cannot reach Pages through workflow_run.
    if: >-
      github.event.repository.visibility == 'public' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      autonomous_release: ${{ steps.newsroom.outputs.enabled }}
      source_ref: ${{ steps.source.outputs.ref }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          # Footnote: workflow_run.head_sha is the commit that STARTED the refresh.
          # The refresh may have committed a newer release before completing. In that
          # event we deliberately resolve main only after the workflow finished.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false

      - name: Record exact assembled revision
        id: source
        shell: bash
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prove the frozen overlay still matches its editable source
        run: python tools/build_final_release.py --check

      - name: Assemble frozen English release and apply curated locales
        run: |
          rm -rf publish
          cp -a site publish
          python tools/apply_final_release.py publish
          CANONICAL_HASH=$(python - <<'PY'
          import json
          print(json.load(open('release-overlay/final/manifest.json', encoding='utf-8'))['index_sha256'])
          PY
          )
          python tools/apply_curated_i18n.py publish "$CANONICAL_HASH"

      - name: Render runtime contracts in a real browser
        run: python tests/oraculos/verificar_dom.py publish

      - name: Prove the public receipt matches the assembled tree
        run: python tools/build_ready_receipt.py --check

      - name: Detect autonomous-newsroom receipt
        id: newsroom
        shell: bash
        run: |
          if [ -f publish/data/newsroom-status.json ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            # Footnote: this compatibility branch exists only for the one-time migration
            # from the pre-Airlock-v2 public release. Once the first autonomous receipt
            # lands, every subsequent Pages release is post-deploy verified.
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish

  deploy:
    if: github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: needs.build.outputs.autonomous_release == 'true'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the exact deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.source_ref }}
          persist-credentials: false

      - name: Reassemble expected public candidate
        run: |
          rm -rf publish
          cp -a site publish
          python tools/apply_final_release.py publish
          CANONICAL_HASH=$(python - <<'PY'
          import json
          print(json.load(open('release-overlay/final/manifest.json', encoding='utf-8'))['index_sha256'])
          PY
          )
          python tools/apply_curated_i18n.py publish "$CANONICAL_HASH"

      - name: Prove the candidate is really live
        run: >-
          python tests/oraculos/verificar_live.py publish
          "${{ needs.deploy.outputs.page_url }}"
