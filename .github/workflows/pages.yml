name: Deploy FCMO AI Newsletter

on:
  push:
    branches: [main]
    paths:
      - 'site/data/stories.v2.json'
      - 'site/data/newsroom-status.json'
      - 'site-src/**'
      - 'config/site.json'
      - 'design/**'
      - 'i18n/**'
      - 'tools/paper/**'
      - 'tools/gates/**'
      - 'tools/build_deployment_identity.py'
      - 'tools/verify_live_front_page.py'
      - 'tests/oraculos/verificar_paper.py'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Refresh the autonomous newsroom from the sanitized corpus']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'deploy builds main; rollback rebuilds and deploys the live-verified lkg tag'
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Failed upstream notifications are no-ops and must not cancel a real run.
  # Manual rollback intentionally shares the active lease so it supersedes any
  # candidate still in flight and is the final Pages writer.
  group: github-pages-v4-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || 'active' }}
  cancel-in-progress: true

env:
  BASE_PATH: /FCMO-AI-Newsletter/
  PUBLIC_ORIGIN: https://fcmo-ai.github.io/FCMO-AI-Newsletter/

jobs:
  build:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact current publication input with LKG history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a deploy until the existing live release is anchored as LKG
        run: git rev-parse --verify 'refs/tags/lkg^{commit}'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save playwright@1.63.0
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/playwright/node_modules/playwright" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Render locale-specific Open Graph cards
        run: >-
          python tools/paper/og_image.py
          --stories site/data/stories.v2.json
          --out "$RUNNER_TEMP/paper-og"

      - name: Build today's static newspaper from the Story layer
        run: >-
          python tools/paper/build.py
          --stories site/data/stories.v2.json
          --status site/data/newsroom-status.json
          --out publish
          --base "$BASE_PATH"
          --og-source "$RUNNER_TEMP/paper-og"

      - name: Put the governed glossary inside the exact candidate
        run: |
          mkdir -p publish/data
          cp i18n/glossary.yml publish/data/glossary.json

      - name: Run every deterministic publication gate before deploy
        run: python tools/gates/run_all.py publish

      - name: Run the real-browser matrix before deploy
        run: |
          export CHROME_PATH="$(node -e "console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())")"
          python tests/oraculos/verificar_paper.py publish

      - name: Bind the exact candidate to a public deployment identity
        run: >-
          python tools/build_deployment_identity.py
          --site publish
          --output publish/deployment-identity.json
          --source-commit "$(git rev-parse HEAD)"

      - name: Preserve identity independently of the Pages artifact
        uses: actions/upload-artifact@v6
        with:
          name: candidate-identity-${{ github.run_id }}
          path: publish/deployment-identity.json
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only the fully gated candidate
        uses: actions/upload-pages-artifact@v4
        with:
          name: candidate-pages-${{ github.run_id }}
          path: publish
          retention-days: 7

  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy the gated candidate
        id: pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: candidate-pages-${{ github.run_id }}

  live-verify:
    name: verify exact candidate at the public origin
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: candidate-identity-${{ github.run_id }}
          path: identity
      - name: Poll through CDN propagation, then prove identity and critical routes
        run: >-
          python tools/verify_live_front_page.py
          --expected-identity identity/deployment-identity.json
          --base-url "$PUBLIC_ORIGIN"
          --timeout-seconds 900
          --poll-seconds 15

  promote-lkg:
    name: advance LKG only after public-origin verification
    needs: live-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          name: candidate-identity-${{ github.run_id }}
          path: identity
      - name: Move the recoverable LKG tag to the verified source commit
        shell: bash
        run: |
          set -euo pipefail
          LKG_SHA="$(python -c "import json; print(json.load(open('identity/deployment-identity.json'))['source_commit'])")"
          git cat-file -e "$LKG_SHA^{commit}"
          git tag -f lkg "$LKG_SHA"
          git push --force origin refs/tags/lkg

  rollback-build:
    name: rebuild immutable LKG after a failed live verify or manual rollback
    needs: [deploy, live-verify]
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback') ||
       (needs.deploy.result == 'success' &&
        (needs.live-verify.result == 'failure' || needs.live-verify.result == 'cancelled')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current recovery controls
        uses: actions/checkout@v6
        with:
          path: control
          persist-credentials: false
      - name: Checkout the live-verified LKG tag, independent of artifact retention
        uses: actions/checkout@v6
        with:
          ref: lkg
          fetch-depth: 0
          path: lkg-source
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: hashFiles('lkg-source/tools/paper/build.py') != ''
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium for paper LKG
        if: hashFiles('lkg-source/tools/paper/build.py') != ''
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save playwright@1.63.0
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/playwright/node_modules/playwright" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Rebuild and verify LKG with its native release system
        shell: bash
        run: |
          set -euo pipefail
          LKG_SHA="$(git -C lkg-source rev-parse HEAD)"
          if test -f lkg-source/tools/paper/build.py; then
            python lkg-source/tools/paper/og_image.py \
              --stories lkg-source/site/data/stories.v2.json \
              --out "$RUNNER_TEMP/rollback-og"
            python lkg-source/tools/paper/build.py \
              --stories lkg-source/site/data/stories.v2.json \
              --status lkg-source/site/data/newsroom-status.json \
              --out rollback-publish --base "$BASE_PATH" \
              --og-source "$RUNNER_TEMP/rollback-og"
            mkdir -p rollback-publish/data
            cp lkg-source/i18n/glossary.yml rollback-publish/data/glossary.json
            python control/tools/gates/run_all.py rollback-publish
            export CHROME_PATH="$(node -e "console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())")"
            python control/tests/oraculos/verificar_paper.py rollback-publish
          else
            cp -a lkg-source/site rollback-publish
            (cd lkg-source && python tools/build_final_release.py --check)
            (cd lkg-source && python tools/apply_final_release.py ../rollback-publish)
            CANONICAL_HASH="$(python -c "import json; print(json.load(open('lkg-source/release-overlay/final/manifest.json'))['index_sha256'])")"
            (cd lkg-source && python tools/apply_curated_i18n.py ../rollback-publish "$CANONICAL_HASH")
            cp lkg-source/site/data/stories.json rollback-publish/data/stories.json
            (cd lkg-source && python tools/promote_story_front_page.py --site ../rollback-publish)
            (cd lkg-source && python tools/apply_front_page_layout.py --site ../rollback-publish)
            (cd lkg-source && python tools/build_editorial_frontends.py --site ../rollback-publish)
            (cd lkg-source && python tools/edition_banner.py --site ../rollback-publish)
            (cd lkg-source && python tools/finalize_editorial_frontends.py --site ../rollback-publish --refresh-manifest)
            (cd lkg-source && python tools/verify_release.py)
            (cd lkg-source && python tests/oraculos/verificar_dom.py ../rollback-publish)
            (cd lkg-source && python tests/oraculos/verificar_home_lead.py ../rollback-publish)
            (cd lkg-source && python tests/oraculos/verificar_layout.py ../rollback-publish)
            (cd lkg-source && python tests/oraculos/verificar_editorial_layout.py ../rollback-publish)
            (cd lkg-source && python tests/oraculos/verificar_surface_freshness.py ../rollback-publish)
          fi
          python control/tools/build_deployment_identity.py \
            --site rollback-publish --output rollback-publish/deployment-identity.json \
            --source-commit "$LKG_SHA"
      - uses: actions/upload-artifact@v6
        with:
          name: rollback-identity-${{ github.run_id }}
          path: rollback-publish/deployment-identity.json
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        with:
          name: rollback-pages-${{ github.run_id }}
          path: rollback-publish
          retention-days: 7

  rollback:
    needs: rollback-build
    if: always() && needs.rollback-build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Redeploy LKG
        id: pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: rollback-pages-${{ github.run_id }}

  rollback-verify:
    needs: rollback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: rollback-identity-${{ github.run_id }}
          path: identity
      - name: Prove the public origin is serving LKG again
        run: >-
          python tools/verify_live_front_page.py
          --expected-identity identity/deployment-identity.json
          --base-url "$PUBLIC_ORIGIN"
          --timeout-seconds 900
          --poll-seconds 15
