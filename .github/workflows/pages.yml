name: Deploy FCMO AI Newsletter

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'release-overlay/final/**'
      - 'tools/apply_final_release.py'
      - 'tools/apply_curated_i18n.py'
      - 'tools/verify_live_newsroom.py'
      - 'tests/oraculos/verificar_dom.py'
      - '.github/workflows/pages.yml'
  # Un push hecho con GITHUB_TOKEN no dispara otros workflows. Tanto la redaccion
  # diaria como el bootstrap publico comitean asi; workflow_run es por tanto el
  # puente deliberado hacia Pages.
  workflow_run:
    workflows:
      - 'Refresh the autonomous newsroom from the sanitized corpus'
      - 'Bootstrap autonomous newsroom from existing public release'
    types: [completed]
    branches: [main]
  public:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Footnote: the repository is public today, but keeping the visibility gate
    # makes a future visibility change safe by default rather than deploy-by-surprise.
    # A failed newsroom refresh/bootstrap cannot reach Pages through workflow_run.
    if: >-
      github.event.repository.visibility == 'public' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prove the frozen overlay still matches its editable source
        run: python tools/build_final_release.py --check

      - name: Assemble frozen English release and apply curated locales
        run: |
          rm -rf publish
          cp -a site publish
          python tools/apply_final_release.py publish
          CANONICAL_HASH=$(python - <<'PY'
          import json
          print(json.load(open('release-overlay/final/manifest.json', encoding='utf-8'))['index_sha256'])
          PY
          )
          python tools/apply_curated_i18n.py publish "$CANONICAL_HASH"

      - name: Render runtime contracts in a real browser
        run: python tests/oraculos/verificar_dom.py publish

      - name: Prove the public receipt matches the assembled tree
        run: python tools/build_ready_receipt.py --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish

  deploy:
    if: github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-oracle:
    name: prove the deployed newspaper is actually live
    if: github.event.repository.visibility == 'public'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify production origin, release identity and multilingual Story routes
        run: python tools/verify_live_newsroom.py --allow-unbootstrapped
