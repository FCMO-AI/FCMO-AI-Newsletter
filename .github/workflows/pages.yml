name: Deploy FCMO AI Newsletter

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'release-overlay/final/**'
      - 'tools/apply_final_release.py'
      - 'tools/apply_curated_i18n.py'
      - 'tools/build_editorial_frontends.py'
      - 'tools/finalize_editorial_frontends.py'
      - 'tools/promote_story_front_page.py'
      - 'tools/verify_live_newsroom.py'
      - 'tools/verify_live_front_page.py'
      - 'tests/oraculos/verificar_dom.py'
      - 'tests/oraculos/verificar_layout.py'
      - 'tests/oraculos/verificar_home_lead.py'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - 'Refresh the autonomous newsroom from the sanitized corpus'
      - 'Bootstrap autonomous newsroom from existing public release'
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.repository.visibility == 'public' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prove the frozen overlay still matches its editable source
        run: python tools/build_final_release.py --check

      - name: Assemble frozen release and apply committed native locales
        run: |
          rm -rf publish
          cp -a site publish
          python tools/apply_final_release.py publish
          CANONICAL_HASH=$(python - <<'PY'
          import json
          print(json.load(open('release-overlay/final/manifest.json', encoding='utf-8'))['index_sha256'])
          PY
          )
          python tools/apply_curated_i18n.py publish "$CANONICAL_HASH"
          # The frozen canonical overlay predates the autonomous Story layer.  It
          # must never be allowed to leave the reader-facing / page on yesterday's
          # lead.  Rebind the deployed front page to the exact Story layer that
          # this commit is shipping, after every potentially-overwriting overlay.
          cp site/data/stories.json publish/data/stories.json
          python tools/promote_story_front_page.py --site publish

      - name: Build discovery frontends on the exact Pages candidate
        run: |
          python tools/build_editorial_frontends.py --site publish
          python tools/finalize_editorial_frontends.py --site publish --refresh-manifest

      - name: Render runtime contracts in a real browser
        run: python tests/oraculos/verificar_dom.py publish

      - name: Prove the current homepage lead survives runtime and localization
        run: python tests/oraculos/verificar_home_lead.py publish

      - name: Render responsive layout contracts across physical viewports
        run: python tests/oraculos/verificar_layout.py publish

      - name: Prove the public receipt matches the assembled tree
        run: python tools/build_ready_receipt.py --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish

  deploy:
    if: github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-oracle:
    name: prove the deployed newspaper is actually live
    if: github.event.repository.visibility == 'public'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify production origin, release identity and public route suite
        run: python tools/verify_live_newsroom.py --allow-unbootstrapped
      - name: Verify the headline readers actually see in source
        run: python tools/verify_live_front_page.py
      - name: Verify the deployed homepage in a real browser across EN/ES/ZH
        run: python tests/oraculos/verificar_home_lead.py site --base-url https://fcmo-ai.github.io/FCMO-AI-Newsletter/
