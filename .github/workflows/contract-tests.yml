name: Contract unit tests

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'tools/**'
      - 'contracts/**'
      - 'config/**'
      - 'i18n/**'
      - 'scaffold/**'
      - '.github/workflows/contract-tests.yml'
  pull_request:
    paths:
      - 'tests/**'
      - 'tools/**'
      - 'contracts/**'
      - 'config/**'
      - 'i18n/**'
      - 'scaffold/**'
      - '.github/workflows/contract-tests.yml'

permissions:
  contents: read

concurrency:
  group: newsletter-contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Local Studio remotes and publication history need a complete clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile tools and test modules
        run: python -m compileall -q tools tests
      - name: Install regression dependencies
        run: |
          python -m pip install PyYAML==6.0.2
          sudo apt-get update
          sudo apt-get install -y age
      - name: Run source-level unit and contract tests
        env:
          FCMO_SKIP_STATEFUL_REFRESH_ORACLES: '1'
        run: python -m unittest discover -s tests -v
