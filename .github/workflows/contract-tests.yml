name: Contract unit tests

on:
  workflow_call:
    inputs:
      source_commit:
        description: Commit whose complete unittest suite must pass
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'tools/**'
      - 'contracts/**'
      - 'config/**'
      - 'i18n/**'
      - 'scaffold/**'
      - '.github/workflows/contract-tests.yml'
  pull_request:
    paths:
      - 'tests/**'
      - 'tools/**'
      - 'contracts/**'
      - 'config/**'
      - 'i18n/**'
      - 'scaffold/**'
      - '.github/workflows/contract-tests.yml'

permissions:
  contents: read

concurrency:
  # Include the caller workflow so separate required checks cannot cancel one another.
  group: newsletter-contract-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the existing standalone `test` status check name. Called release gates
  # use the complete suite as parallel deterministic shards below.
  test:
    # In a called workflow github.event_name is the caller's event, so the
    # required source_commit input is what identifies a release-gate call.
    if: ${{ !inputs.source_commit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Local Studio remotes and publication history need a complete clone.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile tools and test modules
        run: python -m compileall -q tools tests
      - name: Install regression dependencies
        run: |
          python -m pip install PyYAML==6.0.2
          sudo apt-get update
          sudo apt-get install -y age
      - name: Run source-level unit and contract tests
        env:
          FCMO_SKIP_STATEFUL_REFRESH_ORACLES: '1'
        run: python -m unittest discover -s tests -v

  # Matrix failure is fail-closed: the reusable workflow job succeeds only when
  # every shard passes; tests/test_unittest_shards.py proves exact coverage.
  gate-shards:
    if: ${{ inputs.source_commit != null && inputs.source_commit != '' }}
    name: unittest shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile tools and test modules
        run: python -m compileall -q tools tests
      - name: Install regression dependencies
        run: |
          python -m pip install PyYAML==6.0.2
          sudo apt-get update
          sudo apt-get install -y age
      - name: Run assigned source-level unit and contract tests
        env:
          FCMO_SKIP_STATEFUL_REFRESH_ORACLES: '1'
        run: python tools/unittest_shards.py --index "${{ matrix.shard }}" --count 4
