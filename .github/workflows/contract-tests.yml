name: Contract unit tests

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'tools/**'
      - 'scaffold/**'
      - '.github/workflows/contract-tests.yml'
  pull_request:
    paths:
      - 'tests/**'
      - 'tools/**'
      - 'scaffold/**'
      - '.github/workflows/contract-tests.yml'

permissions:
  contents: read

concurrency:
  group: newsletter-contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile test modules
        run: python -m compileall -q tests
      - name: Run source-level unit and contract tests
        env:
          FCMO_SKIP_STATEFUL_REFRESH_ORACLES: '1'
        run: python -m unittest discover -s tests -v
