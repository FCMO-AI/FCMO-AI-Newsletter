name: Pull airlocked newswire with GitHub App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/newswire-bridge.yml'
  schedule:
    # GitHub schedules are best-effort. The bridge runs hourly so a material,
    # publication-safe canonical change reaches the live newsroom with <=~1h
    # transport lag. Every run writes corpus/wire-status.json, the liveness
    # heartbeat; it is committed when the state or release changes, or at least
    # every 5h, so a quiet upstream is never mistaken for an outage. Airlocks with
    # unchanged semantic content still create no corpus content commit and no rebuild.
    # Each run first tries exact current ARB main and falls back only to the last
    # sealed PUBLICATION_READY ancestor when current research is not publication-safe.
    - cron: '10 * * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: 'Safety drill (empty = normal run)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - force_checkpoint
          - regressing_snapshot

permissions:
  contents: write

concurrency:
  # Newer bridge truth supersedes older transport work. The surviving run then
  # rebases its *verified corpus only* onto the latest public main before commit.
  group: fcmo-newswire-bridge-v2
  cancel-in-progress: true

env:
  # Drills are honoured only on manual runs; every other event ignores them.
  # force_checkpoint behaves as if current ARB main were red (serve the sealed
  # checkpoint); regressing_snapshot feeds the corpus guard a copy that drops
  # more than the refusal ratio and must never be staged.
  FCMO_DRILL: ${{ github.event_name == 'workflow_dispatch' && inputs.drill || '' }}

jobs:
  bridge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the public sink
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Require the GitHub App Client ID
        id: config
        env:
          APP_CLIENT_ID: ${{ vars.FCMO_NEWSWIRE_APP_CLIENT_ID }}
        shell: bash
        run: |
          set +x
          exec 3>&1 >/dev/null 2>&1
          trap 'rc=$?; printf "step_exit=%s\n" "$rc" >&3' EXIT
          # Public failure codes of this run ($CODES is exported to later steps).
          CODES="$RUNNER_TEMP/fcmo-bridge-codes"
          mkdir -p "$CODES"
          printf 'CODES=%s\n' "$CODES" >> "$GITHUB_ENV"
          test -n "$APP_CLIENT_ID" || { echo 'FCMO_NEWSWIRE_APP_CLIENT_ID is not configured' >&2; exit 1; }

      - name: Mint a read-only token scoped only to private ARB
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.FCMO_NEWSWIRE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FCMO_NEWSWIRE_APP_PRIVATE_KEY }}
          owner: FCMO-AI
          repositories: AI-Research-Breakthroughs
          permission-contents: read

      # Promotion is two-dimensional: the atomic seal owns public-byte
      # safety/privacy, while the exact debt ratchet prevents structurally regressed
      # canonical main from becoming the source of a new public release.
      # Diagnostics never reach this public log: private tool output goes to a
      # temporary file that is deleted at once. Only public codes (SEAL_FAIL:<CLASS>,
      # probe codes, transport error codes) are kept, in $CODES, and they end up in
      # corpus/wire-status.json.
      - name: Select freshest sealed immutable ARB snapshot
        id: select
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set +x
          exec 3>&1 >/dev/null 2>&1
          trap 'rc=$?; printf "step_exit=%s\n" "$rc" >&3' EXIT
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/fcmo-newswire-private-source"
          PRIVATE_SHA="$RUNNER_TEMP/fcmo-newswire-private-source.sha"
          CANDIDATE_LOG="$RUNNER_TEMP/fcmo-newswire-current-main-seal.log"
          rm -rf "$RUNNER_TEMP/fcmo-newswire-private-source"
          rm -f "$PRIVATE_SHA" "$CANDIDATE_LOG"
          echo 'CLONE_FAILED' >"$CODES/transport_error"

          AUTH=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --quiet --depth 1 --single-branch --branch main \
            https://github.com/FCMO-AI/AI-Research-Breakthroughs.git \
            "$PRIVATE_DIR"

          echo 'CHECKPOINT_INVALID' >"$CODES/transport_error"
          READY_SHA=$(env -i "PATH=$PATH" "HOME=$HOME" "PRIVATE_DIR_ENV=$PRIVATE_DIR" python - 3>&- <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          path = Path(os.environ["PRIVATE_DIR_ENV"]) / "state" / "PUBLICATION_READY.json"
          try:
              doc = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit("publication-ready checkpoint is absent or invalid") from exc
          sha = str(doc.get("source_commit") or "")
          if (
              doc.get("schema") != "arb-publication-ready-v1"
              or doc.get("state") != "READY"
              or doc.get("policy") != "immutable-sealed-snapshot"
              or not re.fullmatch(r"[0-9a-f]{40}", sha)
          ):
              raise SystemExit("publication-ready checkpoint contract mismatch")
          print(sha)
          PY
          )

          echo 'CLONE_FAILED' >"$CODES/transport_error"
          git -C "$PRIVATE_DIR" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch --quiet --unshallow origin main
          CURRENT_SHA=$(git -C "$PRIVATE_DIR" rev-parse origin/main)

          echo 'SELECT_FAILED' >"$CODES/transport_error"
          SELECTED_SHA=''
          SAFE_REASON=''
          git -C "$PRIVATE_DIR" checkout --detach --quiet "$CURRENT_SHA"
          if test "$FCMO_DRILL" = 'force_checkpoint'; then
            SAFE_REASON='DRILL_FORCE_CHECKPOINT'
            echo 'Drill force_checkpoint: treating current ARB main as not promotion-safe.'
          elif (
            cd "$PRIVATE_DIR" &&
            env -i \
              "PATH=$PATH" \
              "HOME=$HOME" \
              "LANG=C.UTF-8" \
              "LC_ALL=C.UTF-8" \
              "ARB_SITE_BASE_PATH=/FCMO-AI-Newsletter" \
              "ARB_PUBLIC_BASE_URL=https://fcmo-ai.github.io/FCMO-AI-Newsletter" \
              python tools/publication_seal.py 3>&- &&
              env -i "PATH=$PATH" "HOME=$HOME" "LANG=C.UTF-8" "LC_ALL=C.UTF-8" python tools/validate_integrity_ratchet.py --json 3>&-
          ) >"$CANDIDATE_LOG" 2>&1 && grep -qx 'SEAL_OK' "$CANDIDATE_LOG"; then
            SELECTED_SHA="$CURRENT_SHA"
            echo 'MAIN' >"$CODES/source_mode"
            echo 'Fresh canonical ARB main passed the publication seal and no-new-debt ratchet.'
          else
            SAFE_REASON=''
            if test -z "$SAFE_REASON" && grep -q '"state": "REGRESSION"' "$CANDIDATE_LOG"; then
              SAFE_REASON='INTEGRITY_DEBT_REGRESSION'
            fi
          fi
          rm -f "$CANDIDATE_LOG"
          if test -z "$SELECTED_SHA"; then
            SAFE_REASON="${SAFE_REASON:-UNCLASSIFIED_SAFETY_FAILURE}"
            echo "Current ARB main is not promotion-safe; using last sealed checkpoint ($SAFE_REASON)."
            echo "$SAFE_REASON" >>"$CODES/arb_failures"
            # origin/main was already unshallowed above, so every ancestor of
            # current main is locally addressable. Avoid a redundant raw-SHA fetch:
            # GitHub may reject direct object fetches even when the commit is a
            # perfectly valid reachable ancestor.
            git -C "$PRIVATE_DIR" cat-file -e "$READY_SHA^{commit}"
            if ! git -C "$PRIVATE_DIR" merge-base --is-ancestor "$READY_SHA" origin/main; then
              echo 'publication-ready checkpoint is outside canonical main lineage' >&2
              echo 'CHECKPOINT_OUTSIDE_LINEAGE' >"$CODES/transport_error"
              exit 1
            fi
            git -C "$PRIVATE_DIR" checkout --detach --quiet "$READY_SHA"
            SELECTED_SHA="$READY_SHA"
            echo 'CHECKPOINT' >"$CODES/source_mode"
            # Commit time of the sealed checkpoint: a public timestamp, not content.
            git -C "$PRIVATE_DIR" show -s --format=%cI "$READY_SHA" >"$CODES/checkpoint_at"
          fi

          test "$(git -C "$PRIVATE_DIR" rev-parse HEAD)" = "$SELECTED_SHA"
          git -C "$PRIVATE_DIR" rev-parse HEAD >"$PRIVATE_SHA"
          test -s "$PRIVATE_SHA"
          test -z "$(git -C "$PRIVATE_DIR" branch --show-current)"
          rm -f "$CODES/transport_error"
          unset AUTH APP_TOKEN READY_SHA CURRENT_SHA SELECTED_SHA

      - name: Measure current canonical ARB integrity on the working GitHub runner
        id: probe
        shell: bash
        run: |
          set +x
          exec 3>&1 >/dev/null 2>&1
          trap 'rc=$?; printf "step_exit=%s\n" "$rc" >&3' EXIT
          # This is deliberately observational, not a second publication gate.
          # Always diagnose *current canonical main*, even when publication fell
          # back to an older sealed snapshot. Historical fallback snapshots are
          # publication artifacts, not the runtime that defines today's integrity
          # tools/tests/orientation contracts. The native-edition coverage probe
          # complements the isolated translation-source-health workflow. Probe output
          # goes to a private log that is deleted at once; a failing probe is
          # recorded only by its code (arb_main_failures in corpus/wire-status.json).
          set -euo pipefail
          PROBE_LOG="$RUNNER_TEMP/fcmo-newswire-probe.log"
          PRIVATE_DIR="$RUNNER_TEMP/fcmo-newswire-private-source"
          PRIVATE_SHA="$RUNNER_TEMP/fcmo-newswire-private-source.sha"
          test -s "$PRIVATE_SHA" || { echo 'selected private snapshot receipt is missing' >&2; exit 1; }
          read -r SELECTED_SHA < "$PRIVATE_SHA"
          test -n "$SELECTED_SHA" || { echo 'selected private snapshot SHA is empty' >&2; exit 1; }
          CURRENT_SHA="$(git -C "$PRIVATE_DIR" rev-parse origin/main)"
          cd "$PRIVATE_DIR"
          git checkout --detach --quiet "$CURRENT_SHA"
          failures=0
          set +e
          while IFS='|' read -r code cmd; do
            env -i "PATH=$PATH" "HOME=$HOME" "LANG=C.UTF-8" "LC_ALL=C.UTF-8" bash -o pipefail -c "$cmd" 3>&- </dev/null >"$PROBE_LOG" 2>&1
            rc=$?
            rm -f "$RUNNER_TEMP/fcmo-newswire-probe.log"
            if test "$rc" -ne 0; then
              echo "$code" >>"$CODES/arb_failures"
              echo "::warning::ARB current-main probe failed: $code"
              failures=$((failures+1))
            fi
          done <<'PROBES'
          INTEGRITY_RATCHET|python tools/validate_integrity_ratchet.py --json
          TEST_SUITE|python -m unittest discover -s tests -v
          OPERATIONAL_PROBES|python tools/arb.py doctor
          OPERATIONAL_PROBES|python tools/arb.py orient --json
          OPERATIONAL_PROBES|python tools/arb.py next --json
          NATIVE_EDITION_COVERAGE|python tools/check_native_edition_coverage.py --recent-days 7
          PROBES
          set -e
          git checkout --detach --quiet "$SELECTED_SHA"
          test "$(git rev-parse HEAD)" = "$SELECTED_SHA"
          echo "ARB current-main probes completed with $failures failing probe(s); selected publication snapshot was restored unchanged."
          exit 0

      - name: Prove selected immutable snapshot through ARB's atomic publication seal
        id: seal
        shell: bash
        run: |
          set +x
          exec 3>&1 >/dev/null 2>&1
          trap 'rc=$?; printf "step_exit=%s\n" "$rc" >&3' EXIT
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/fcmo-newswire-private-source"
          PRIVATE_LOG="$RUNNER_TEMP/fcmo-newswire-private-seal.log"
          echo 'SEAL_FAIL:UNCLASSIFIED' >"$CODES/transport_error"
          if ! (
            cd "$PRIVATE_DIR" &&
            env -i \
              "PATH=$PATH" \
              "HOME=$HOME" \
              "LANG=C.UTF-8" \
              "LC_ALL=C.UTF-8" \
              "ARB_SITE_BASE_PATH=/FCMO-AI-Newsletter" \
              "ARB_PUBLIC_BASE_URL=https://fcmo-ai.github.io/FCMO-AI-Newsletter" \
              python tools/publication_seal.py 3>&-
          ) >"$PRIVATE_LOG" 2>&1; then
            SAFE_REASON='SEAL_FAIL:UNCLASSIFIED'
            rm -f "$PRIVATE_LOG"
            echo "${SAFE_REASON:-SEAL_FAIL:UNCLASSIFIED}" >&2
            echo "${SAFE_REASON:-SEAL_FAIL:UNCLASSIFIED}" >"$CODES/transport_error"
            exit 1
          fi
          grep -qx 'SEAL_OK' "$PRIVATE_LOG" || {
            rm -f "$PRIVATE_LOG"
            echo 'SEAL_FAIL:UNCLASSIFIED_SUCCESS_OUTPUT' >&2
            echo 'SEAL_FAIL:UNCLASSIFIED_SUCCESS_OUTPUT' >"$CODES/transport_error"
            exit 1
          }
          rm -f "$PRIVATE_LOG"
          rm -f "$CODES/transport_error"
          echo 'Selected private ARB snapshot passed the atomic publication seal.'

      - name: Extract only the already-sanitized release, then destroy private checkout
        id: extract
        shell: bash
        run: |
          set +x
          exec 3>&1 >/dev/null 2>&1
          trap 'rc=$?; printf "step_exit=%s\n" "$rc" >&3' EXIT
          set -euo pipefail
          echo 'EXTRACT_FAILED' >"$CODES/transport_error"
          PRIVATE_DIR="$RUNNER_TEMP/fcmo-newswire-private-source"
          PRIVATE_SHA="$RUNNER_TEMP/fcmo-newswire-private-source.sha"
          RELEASE_DIR="$RUNNER_TEMP/fcmo-newswire-airlocked-release"
          rm -rf "$RUNNER_TEMP/fcmo-newswire-airlocked-release"
          mkdir -p "$RELEASE_DIR"
          cp -a "$PRIVATE_DIR/_public_release/." "$RELEASE_DIR/"
          rm -rf "$RUNNER_TEMP/fcmo-newswire-private-source"
          rm -f "$PRIVATE_SHA"
          test ! -e "$PRIVATE_DIR"
          test ! -e "$PRIVATE_SHA"
          printf 'RELEASE_DIR=%s\n' "$RELEASE_DIR" >> "$GITHUB_ENV"
          rm -f "$CODES/transport_error"

      - name: Independently verify the airlocked bytes from the public side
        id: verify
        shell: bash
        run: |
          set +x
          exec 3>&1 >/dev/null 2>&1
          trap 'rc=$?; printf "step_exit=%s\n" "$rc" >&3' EXIT
          set -euo pipefail
          echo 'VERIFY_FAILED' >"$CODES/transport_error"
          env -i "PATH=$PATH" "HOME=$HOME" python tools/newswire_bridge_partial_locales.py verify "$RELEASE_DIR" 3>&-
          rm -f "$CODES/transport_error"

      - name: Rebase transport onto current public main before staging
        id: rebase
        shell: bash
        run: |
          set +x
          exec 3>&1 >/dev/null 2>&1
          trap 'rc=$?; printf "step_exit=%s\n" "$rc" >&3' EXIT
          set -euo pipefail
          echo 'VERIFY_FAILED' >"$CODES/transport_error"
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          env -i "PATH=$PATH" "HOME=$HOME" python tools/newswire_bridge_partial_locales.py verify "$RELEASE_DIR" 3>&-
          rm -f "$CODES/transport_error"

      # tools/corpus_guard.py (CLI contract in contracts/README.md) compares the
      # candidate with the published corpus: a missing story is carried forward
      # and alerted, a regression beyond the refusal ratio is refused, and a
      # tombstoned story stays withdrawn. An unchanged release_id + corpus digest
      # is only checked, never staged (no content commit, no rebuild).
      - name: Guard the verified candidate against the published corpus
        id: guard
        shell: bash
        run: |
          set +x
          exec 3>&1 >/dev/null 2>&1
          trap 'rc=$?; printf "step_exit=%s\n" "$rc" >&3' EXIT
          set -euo pipefail
          echo 'GUARD_ERROR' >"$CODES/transport_error"
          env -i "PATH=$PATH" "HOME=$HOME" python tools/wire_status.py guard 3>&- \
            --published corpus \
            --candidate "$RELEASE_DIR" \
            --out "$RUNNER_TEMP/fcmo-newswire-guarded" \
            --report "$CODES/guard-report.json" \
            --drill "$FCMO_DRILL" \
            --github-output "$CODES/guard-decision.env"
          GUARD_STAGE=$(sed -n 's/^stage=//p' "$CODES/guard-decision.env")
          case "$GUARD_STAGE" in true|false) printf 'stage=%s\n' "$GUARD_STAGE" >> "$GITHUB_OUTPUT" ;; *) exit 1 ;; esac
          rm -f "$CODES/transport_error"

      - name: Atomically replace only corpus/
        id: stage
        if: steps.guard.outputs.stage == 'true'
        shell: bash
        run: |
          set +x
          exec 3>&1 >/dev/null 2>&1
          trap 'rc=$?; printf "step_exit=%s\n" "$rc" >&3' EXIT
          set -euo pipefail
          # The verified sealed release replaces corpus/; newsroom-owned files
          # survive the swap and carried.jsonl comes from the guard's output.
          env -i "PATH=$PATH" "HOME=$HOME" python tools/wire_status.py stage 3>&- \
            --release "$RELEASE_DIR" \
            --corpus corpus \
            --guarded "$RUNNER_TEMP/fcmo-newswire-guarded"

      # Runs after success and after failure (not after a supersession cancel):
      # corpus/wire-status.json is the heartbeat, so a failing transport is
      # recorded too, by its code only.
      - name: Record the wire status and commit on top of the newest public main
        if: ${{ !cancelled() }}
        env:
          OUT_CONFIG: ${{ steps.config.outcome }}
          OUT_TOKEN: ${{ steps.app-token.outcome }}
          OUT_SELECT: ${{ steps.select.outcome }}
          OUT_PROBE: ${{ steps.probe.outcome }}
          OUT_SEAL: ${{ steps.seal.outcome }}
          OUT_EXTRACT: ${{ steps.extract.outcome }}
          OUT_VERIFY: ${{ steps.verify.outcome }}
          OUT_REBASE: ${{ steps.rebase.outcome }}
          OUT_GUARD: ${{ steps.guard.outcome }}
          OUT_STAGE: ${{ steps.stage.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set +x
          exec 3>&1 >/dev/null 2>&1
          trap 'rc=$?; printf "step_exit=%s\n" "$rc" >&3' EXIT
          set -euo pipefail
          CODES="${CODES:-$RUNNER_TEMP/fcmo-bridge-codes}"
          mkdir -p "$CODES"
          INCOMING="$RUNNER_TEMP/fcmo-newswire-incoming-corpus"
          rm -rf "$RUNNER_TEMP/fcmo-newswire-airlocked-release" "$RUNNER_TEMP/fcmo-newswire-incoming-corpus"

          TRANSPORT=OK
          ERROR=''
          if test "$OUT_CONFIG" != 'success'; then
            ERROR='APP_NOT_CONFIGURED'
          elif test "$OUT_TOKEN" != 'success'; then
            ERROR='TOKEN_MINT_FAILED'
          else
            for outcome in "$OUT_SELECT" "$OUT_PROBE" "$OUT_SEAL" "$OUT_EXTRACT" "$OUT_VERIFY" "$OUT_REBASE" "$OUT_GUARD"; do
              if test "$outcome" != 'success'; then
                ERROR="$(head -n 1 "$CODES/transport_error" 2>/dev/null || true)"
                ERROR="${ERROR:-BRIDGE_STEP_FAILED}"
                break
              fi
            done
          fi
          if test -z "$ERROR" && test "$OUT_STAGE" = 'failure'; then ERROR='STAGE_FAILED'; fi
          if test -n "$ERROR"; then TRANSPORT=FAIL; fi
          STAGED=false
          if test "$OUT_STAGE" = 'success'; then
            STAGED=true
            cp -a corpus "$INCOMING"
          fi
          case "$EVENT_NAME" in
            schedule|workflow_dispatch|push) TRIGGER="$EVENT_NAME" ;;
            *) TRIGGER=local ;;
          esac

          git config user.name 'FCMO Newswire Bridge'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # This is an optimistic transaction over public main. A concurrent
          # release/health/bridge commit may advance main after our fetch. In that
          # case, never force and never push a stale merge: restart the whole
          # transaction from the newer main, reapply the exact verified corpus,
          # reverify it, and retry. If another bridge already landed equivalent
          # corpus, the transaction converges to a semantic no-op.
          pushed=0
          for attempt in 1 2 3 4 5; do
            echo "Corpus promotion attempt $attempt/5"
            git fetch --quiet origin main
            git reset --hard origin/main
            git clean -fdx
            PREVIOUS="$CODES/previous-wire-status.json"
            rm -f "$CODES/previous-wire-status.json"
            if test -f corpus/wire-status.json; then cp corpus/wire-status.json "$PREVIOUS"; fi

            CONTENT=false
            if test "$STAGED" = true; then
              rm -rf corpus
              cp -a "$INCOMING" corpus
              if test -f "$PREVIOUS"; then cp "$PREVIOUS" corpus/wire-status.json; fi
              # Verify exactly the sealed bytes: newsroom-owned files are not sealed.
              env -i "PATH=$PATH" "HOME=$HOME" python tools/wire_status.py sealed-view --corpus corpus --out "$RUNNER_TEMP/fcmo-newswire-sealed-view" 3>&-
              env -i "PATH=$PATH" "HOME=$HOME" python tools/newswire_bridge_partial_locales.py verify "$RUNNER_TEMP/fcmo-newswire-sealed-view" 3>&-
              rm -rf "$RUNNER_TEMP/fcmo-newswire-sealed-view"
              if ! git diff --quiet HEAD -- corpus || test -n "$(git ls-files --others --exclude-standard -- corpus)"; then
                CONTENT=true
              fi
            fi

            rm -f "$CODES/decision.env"
            env -i "PATH=$PATH" "HOME=$HOME" python tools/wire_status.py write 3>&- \
              --previous "$PREVIOUS" \
              --out "$CODES/wire-status.json" \
              --trigger "$TRIGGER" \
              --drill "$FCMO_DRILL" \
              --transport "$TRANSPORT" \
              --transport-error "$ERROR" \
              --source-mode "$(cat "$CODES/source_mode" 2>/dev/null || true)" \
              --arb-failures "$CODES/arb_failures" \
              --checkpoint-at "$(cat "$CODES/checkpoint_at" 2>/dev/null || true)" \
              --airlock corpus/airlock.json \
              --records corpus/data/developments.jsonl \
              --guard-report "$CODES/guard-report.json" \
              --release-changed "$CONTENT" \
              --github-output "$CODES/decision.env"
            COMMIT=$(grep '^commit=' "$CODES/decision.env" | tail -n 1 | cut -d= -f2)
            if test "$COMMIT" != true && test "$CONTENT" != true; then
              echo 'Wire status unchanged within the heartbeat interval; nothing to commit.'
              pushed=1
              break
            fi
            cp "$CODES/wire-status.json" corpus/wire-status.json

            git add -A -- corpus
            if git diff --cached --quiet -- corpus; then
              echo 'Verified Airlock and wire status already match newest public corpus/ exactly.'
              pushed=1
              break
            fi
            if ! git diff --cached --quiet -- ':!corpus'; then
              echo 'refusing to commit anything outside corpus/' >&2
              git diff --cached --name-only -- ':!corpus' >&2
              exit 1
            fi

            if test "$CONTENT" = true; then
              git commit -q -m 'corpus: receive verified FCMO newswire airlock'
            else
              git commit -q -m 'corpus: record newswire wire status'
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Public main advanced during corpus promotion; retrying from newest main." >&2
          done
          rm -rf "$RUNNER_TEMP/fcmo-newswire-incoming-corpus"
          if test "$pushed" -ne 1; then
            echo 'Corpus promotion did not converge after 5 optimistic retries; refusing force-push.' >&2
            exit 1
          fi
          # A failed transport is recorded above and still fails the run.
          if test "$TRANSPORT" != OK; then
            echo "Bridge transport failed: $ERROR" >&2
            exit 1
          fi

      - name: Destroy any residual private bridge state
        if: always()
        shell: bash
        run: |
          set +x
          exec 3>&1 >/dev/null 2>&1
          trap 'rc=$?; printf "step_exit=%s\n" "$rc" >&3' EXIT
          rm -rf "$RUNNER_TEMP/fcmo-newswire-private-source"
          rm -f "$RUNNER_TEMP/fcmo-newswire-private-source.sha"
          rm -f "$RUNNER_TEMP/fcmo-newswire-private-seal.log"
          rm -f "$RUNNER_TEMP/fcmo-newswire-current-main-seal.log"
          rm -f "$RUNNER_TEMP/fcmo-newswire-probe.log"
          rm -rf "$RUNNER_TEMP/fcmo-newswire-airlocked-release"
          rm -rf "$RUNNER_TEMP/fcmo-newswire-guarded"
          rm -rf "$RUNNER_TEMP/fcmo-bridge-codes"
          test ! -e "$RUNNER_TEMP/fcmo-newswire-private-source"
