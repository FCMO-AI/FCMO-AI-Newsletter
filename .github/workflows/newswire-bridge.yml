name: Pull airlocked newswire with GitHub App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/newswire-bridge.yml'
  schedule:
    # Footnote: GitHub scheduled events are best-effort and may be delayed. These
    # staggered attempts are deliberately idempotent: every run freezes one exact ARB
    # main snapshot, proves it, and publishes only if that snapshot passes the seal.
    # Mexico City is UTC-6 year-round, so these are 07:10, 07:37, 08:11 and 08:47.
    - cron: '10 13 * * *'
    - cron: '37 13 * * *'
    - cron: '11 14 * * *'
    - cron: '47 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fcmo-newswire-bridge
  cancel-in-progress: false

jobs:
  bridge:
    # Footnote: workflow_dispatch can target another ref. The App credential is a
    # private-repository read capability, so only the reviewed default-branch
    # workflow is allowed to reach the token-minting step.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the public sink
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require the GitHub App Client ID
        env:
          APP_CLIENT_ID: ${{ vars.FCMO_NEWSWIRE_APP_CLIENT_ID }}
        shell: bash
        run: |
          # Footnote: the PEM is intentionally not passed to a shell merely to
          # test whether it exists. The token action is the sole secret consumer.
          test -n "$APP_CLIENT_ID" || { echo 'FCMO_NEWSWIRE_APP_CLIENT_ID is not configured' >&2; exit 1; }

      - name: Mint a read-only token scoped only to private ARB
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # Footnote: v3 still accepts legacy app-id, but GitHub recommends the
          # Client ID input. Pin the launch contract to the current interface.
          client-id: ${{ vars.FCMO_NEWSWIRE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FCMO_NEWSWIRE_APP_PRIVATE_KEY }}
          owner: FCMO-AI
          repositories: AI-Research-Breakthroughs
          permission-contents: read

      - name: Materialize one immutable private ARB main snapshot without publishing its identity
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/fcmo-newswire-private-source"
          PRIVATE_SHA="$RUNNER_TEMP/fcmo-newswire-private-source.sha"
          rm -rf "$PRIVATE_DIR"
          rm -f "$PRIVATE_SHA"
          AUTH=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          # Footnote: actions/checkout would print the resolved private SHA in this
          # public workflow. Quiet Git transport keeps both the token and source
          # identity out of logs. The clone captures main exactly once; detaching HEAD
          # freezes that commit for the whole transaction, so later ARB commits cannot
          # race or mutate the snapshot being validated.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --quiet --depth 1 --single-branch --branch main \
            https://github.com/FCMO-AI/AI-Research-Breakthroughs.git \
            "$PRIVATE_DIR"
          git -C "$PRIVATE_DIR" rev-parse HEAD >"$PRIVATE_SHA"
          git -C "$PRIVATE_DIR" checkout --detach --quiet HEAD
          test -s "$PRIVATE_SHA"
          test -z "$(git -C "$PRIVATE_DIR" branch --show-current)"
          unset AUTH APP_TOKEN

      - name: Prove the immutable snapshot through ARB's atomic publication seal
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/fcmo-newswire-private-source"
          PRIVATE_LOG="$RUNNER_TEMP/fcmo-newswire-private-seal.log"
          # Footnote: publication_seal.py owns the complete upstream proof: public
          # unit contracts, real canonical publication inputs, importance semantics,
          # deterministic declassification, native ES/ZH bindings and Airlock receipt.
          # The child runs with an allowlisted environment. Its complete transcript
          # stays private; only stable SEAL_FAIL:<CLASS> reason codes may escape.
          if ! (
            cd "$PRIVATE_DIR" &&
            env -i \
              "PATH=$PATH" \
              "HOME=$HOME" \
              "LANG=C.UTF-8" \
              "LC_ALL=C.UTF-8" \
              "ARB_SITE_BASE_PATH=/FCMO-AI-Newsletter" \
              "ARB_PUBLIC_BASE_URL=https://fcmo-ai.github.io/FCMO-AI-Newsletter" \
              python tools/publication_seal.py
          ) >"$PRIVATE_LOG" 2>&1; then
            SAFE_REASON=$(grep -E '^SEAL_FAIL:[A-Z0-9_]+' "$PRIVATE_LOG" | tail -n 1 || true)
            rm -f "$PRIVATE_LOG"
            echo "${SAFE_REASON:-SEAL_FAIL:UNCLASSIFIED}" >&2
            exit 1
          fi
          grep -qx 'SEAL_OK' "$PRIVATE_LOG" || {
            rm -f "$PRIVATE_LOG"
            echo 'SEAL_FAIL:UNCLASSIFIED_SUCCESS_OUTPUT' >&2
            exit 1
          }
          rm -f "$PRIVATE_LOG"
          echo 'Private ARB runtime publication seal passed.'

      - name: Extract only the already-sanitized release, then destroy private checkout
        shell: bash
        run: |
          PRIVATE_DIR="$RUNNER_TEMP/fcmo-newswire-private-source"
          PRIVATE_SHA="$RUNNER_TEMP/fcmo-newswire-private-source.sha"
          RELEASE_DIR="$RUNNER_TEMP/fcmo-newswire-airlocked-release"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          cp -a "$PRIVATE_DIR/_public_release/." "$RELEASE_DIR/"
          rm -rf "$PRIVATE_DIR"
          rm -f "$PRIVATE_SHA"
          test ! -e "$PRIVATE_DIR"
          test ! -e "$PRIVATE_SHA"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
          # Footnote: no private checkout or private source identity exists when the
          # public-side verifier or Git staging begins. Only the upstream-produced,
          # allowlisted Airlock candidate survives across this boundary.

      - name: Independently verify the airlocked bytes from the public side
        run: python tools/newswire_bridge.py verify "$RELEASE_DIR"

      - name: Rebase transport onto current public main before staging
        shell: bash
        run: |
          # Footnote: the private proof can take time. Resetting and cleaning to the
          # latest public main prevents a scheduled run—or any unexpected workspace
          # residue—from overwriting an unrelated public commit.
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          python tools/newswire_bridge.py verify "$RELEASE_DIR"

      - name: Atomically replace only corpus/
        run: python tools/newswire_bridge.py stage "$RELEASE_DIR" corpus

      - name: Commit only the verified public handoff
        shell: bash
        run: |
          rm -rf "$RELEASE_DIR"
          git config user.name 'FCMO Newswire Bridge'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- corpus
          if git diff --cached --quiet -- corpus; then
            echo 'Verified Airlock already matches corpus/ exactly.'
            exit 0
          fi
          if ! git diff --cached --quiet -- ':!corpus'; then
            echo 'refusing to commit anything outside corpus/' >&2
            git diff --cached --name-only -- ':!corpus' >&2
            exit 1
          fi
          git commit -m 'corpus: receive verified FCMO newswire airlock'
          git push origin HEAD:main
          # Footnote: no explicit API dispatch is needed. The downstream newsroom
          # listens to this workflow's successful completion via workflow_run,
          # which keeps this bridge at Contents-only authority.

      - name: Destroy any residual private bridge state
        if: always()
        shell: bash
        run: |
          # Footnote: successful runs delete private material before public-side
          # verification; this unconditional finalizer covers every earlier failure
          # path as well, before the ephemeral runner itself is torn down.
          rm -rf "$RUNNER_TEMP/fcmo-newswire-private-source"
          rm -f "$RUNNER_TEMP/fcmo-newswire-private-source.sha"
          rm -f "$RUNNER_TEMP/fcmo-newswire-private-seal.log"
          rm -rf "$RUNNER_TEMP/fcmo-newswire-airlocked-release"
          test ! -e "$RUNNER_TEMP/fcmo-newswire-private-source"
          test ! -e "$RUNNER_TEMP/fcmo-newswire-private-source.sha"