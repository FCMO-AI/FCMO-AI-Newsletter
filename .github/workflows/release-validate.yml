name: Validate FCMO Newsletter Release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'prelaunch/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile release tooling
        run: python -m py_compile tools/apply_final_release.py tools/i18n_release.py

      - name: Assemble exact canonical public candidate
        run: |
          rm -rf publish
          cp -a site publish
          python tools/apply_final_release.py publish

      - name: Verify frozen release identity before localization
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('publish')
          manifest=json.loads(Path('release-overlay/final/manifest.json').read_text())
          digest=hashlib.sha256((root/'index.html').read_bytes()).hexdigest()
          assert digest == manifest['index_sha256'], (digest, manifest['index_sha256'])
          assert len(list((root/'data/briefs').glob('FCMO-*.json'))) == manifest['canonical_briefs'] == 22
          assert len(list((root/'developments').glob('FCMO-*.html'))) == manifest['stable_brief_routes'] == 22
          assert len(list((root/'editions').glob('*.html'))) == manifest['edition_routes'] == 3
          assert (root/'build-manifest.json').is_file()
          print('Frozen release identity OK:', digest)
          PY

      - name: Apply curated native-language publication layer
        run: python tools/i18n_release.py publish --source .

      - name: Validate localized derivative
        run: python tools/i18n_release.py publish --source . --validate-only

      - name: Verify three-language release contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('publish')
          catalogue=json.loads((root/'data/translations.json').read_text(encoding='utf-8'))
          derivative=json.loads((root/'localization-manifest.json').read_text(encoding='utf-8'))
          assert catalogue['native_locales'] == ['en','es-419','zh-Hans']
          assert catalogue['required_fields'] == ['title','summary','why_it_matters']
          assert len(catalogue['developments']) == 22
          assert derivative['canonical_briefs'] == 22
          assert derivative['runtime_translation_provider'] is None
          assert derivative['human_reviewed'] is False
          print('Native-language publication contract OK: 22/22 briefs in EN/ES/ZH')
          PY

      - name: Upload localized candidate for inspection
        uses: actions/upload-artifact@v4
        with:
          name: localized-release-candidate
          path: publish
          retention-days: 2

      - name: Confirm validation boundary
        run: |
          echo 'Validation only. This workflow does not deploy or change repository visibility.'
