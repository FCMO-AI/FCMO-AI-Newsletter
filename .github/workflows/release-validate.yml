name: Validate FCMO Newsletter Release

on:
  push:
    branches:
      - 'prelaunch/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble frozen release for audit
        run: |
          rm -rf publish
          cp -a site publish
          python tools/apply_final_release.py publish

      - name: Expose exact Astra canonical brief
        run: |
          mkdir -p localization-audit
          cp publish/data/briefs/FCMO-841949AEA161.json localization-audit/FCMO-841949AEA161.json
          python - <<'PY'
          from pathlib import Path
          import json, re
          text = Path('publish/index.html').read_text(encoding='utf-8')
          m = re.search(r'<script id="fcmo-data" type="application/json">(.*?)</script>', text, re.S)
          data = json.loads(m.group(1))
          row = next(r for r in data['records'] if r['id'] == 'FCMO-841949AEA161')
          Path('localization-audit/FCMO-841949AEA161-index-record.json').write_text(json.dumps(row, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          PY
          git config user.name "FCMO localization audit"
          git config user.email "magyarmex.github@gmail.com"
          git add localization-audit/
          if ! git diff --cached --quiet; then
            git commit -m "Expose exact frozen Astra record for localization audit"
            git push
          fi
