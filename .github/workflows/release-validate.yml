name: Validate static newspaper release

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/data/stories.v2.json'
      - 'site/data/newsroom-status.json'
      - 'site-src/**'
      - 'config/**'
      - 'design/**'
      - 'i18n/**'
      - 'tools/paper/**'
      - 'tools/gates/**'
      - 'tests/oraculos/verificar_paper.py'
      - '.github/workflows/release-validate.yml'

permissions:
  contents: read

concurrency:
  group: paper-release-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile the publication implementation
        run: python -m compileall -q tools tests
      - name: Build today's candidate
        run: >-
          python tools/paper/build.py
          --stories site/data/stories.v2.json
          --status site/data/newsroom-status.json
          --out publish
          --base /FCMO-AI-Newsletter/
      - name: Add governed glossary to candidate
        run: |
          mkdir -p publish/data
          cp i18n/glossary.yml publish/data/glossary.json
          cp site/data/stories.v2.json publish/data/stories.v2.json
          cp site/data/newsroom-status.json publish/data/newsroom-status.json
      - name: Run fail-closed gates
        run: python tools/gates/run_all.py publish
      - name: Run browser matrix
        env:
          PLAYWRIGHT_MODULE: /srv/fcmo/agents/work/newsletter/browser/node_modules/playwright
        run: |
          export CHROME_PATH="$(node -e "console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())")"
          python tests/oraculos/verificar_paper.py publish
      - name: Prove deployment identity can be generated
        run: >-
          python tools/build_deployment_identity.py --site publish
          --output publish/deployment-identity.json --source-commit "$GITHUB_SHA"
      - name: Confirm validation-only boundary
        run: echo 'Validation only; this workflow cannot deploy.'
