name: Validate static newspaper release

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/data/stories.v2.json'
      - 'site/data/newsroom-status.json'
      - 'site-src/**'
      - 'editorial/**'
      - 'ops/publish.py'
      - 'config/**'
      - 'design/**'
      - 'i18n/**'
      - 'tools/paper/**'
      - 'tools/gates/**'
      - 'tests/oraculos/verificar_paper.py'
      - '.github/workflows/release-validate.yml'

permissions:
  contents: read

concurrency:
  group: paper-release-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile the publication implementation
        run: python -m compileall -q tools tests
      - name: Reconstruct and gate the immutable editorial candidate
        run: python ops/publish.py --check
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save playwright@1.63.0
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/playwright/node_modules/playwright" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser matrix
        run: |
          export CHROME_PATH="$(node -e "console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())")"
          python tests/oraculos/verificar_paper.py publish
      - name: Prove deployment identity can be generated
        run: >-
          python tools/build_deployment_identity.py --site publish
          --output publish/deployment-identity.json --source-commit "$GITHUB_SHA"
      - name: Confirm validation-only boundary
        run: echo 'Validation only; this workflow cannot deploy.'
