name: Validate FCMO Newsletter Release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'prelaunch/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile release tooling
        run: python -m py_compile tools/apply_final_release.py

      - name: Assemble exact public candidate
        run: |
          rm -rf publish
          cp -a site publish
          python tools/apply_final_release.py publish

      - name: Verify frozen release identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('publish')
          manifest=json.loads(Path('release-overlay/final/manifest.json').read_text())
          digest=hashlib.sha256((root/'index.html').read_bytes()).hexdigest()
          assert digest == manifest['index_sha256'], (digest, manifest['index_sha256'])
          assert len(list((root/'data/briefs').glob('FCMO-*.json'))) == 22
          assert len(list((root/'developments').glob('FCMO-*.html'))) == 22
          assert len(list((root/'editions').glob('*.html'))) == 3
          assert (root/'build-manifest.json').is_file()
          print('Frozen release identity OK:', digest)
          PY

      - name: Confirm private prelaunch boundary
        run: |
          echo 'Validation only. This workflow does not deploy or change repository visibility.'
