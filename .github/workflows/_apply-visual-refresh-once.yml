name: Apply approved visual maintenance once

on:
  push:
    branches: [visual/viewport-polish-2026-09-10]
    paths:
      - 'tools/_apply_visual_refresh_once.py'
      - 'tests/oraculos/verificar_layout.py'
      - 'site/assets/newsletter-responsive-polish.css'
      - '.github/workflows/_apply-visual-refresh-once.yml'

# Footnote: this workflow is a one-time migration runner on an isolated branch.
# It exists only to let GitHub operate on the repository's full 500KB+ canonical
# index and deterministic release overlay without reconstructing those artifacts
# outside the repository. It never touches main directly.
permissions:
  contents: write

concurrency:
  group: fcmo-visual-refresh-once
  cancel-in-progress: false

jobs:
  migrate-and-prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated visual branch
        uses: actions/checkout@v6
        with:
          ref: visual/viewport-polish-2026-09-10
          fetch-depth: 0

      - name: Apply approved source-level visual maintenance
        run: python tools/_apply_visual_refresh_once.py

      - name: Prove responsive asset has durable ownership
        run: |
          # Footnote: release-src is atomically regenerated by ingest_corpus.py.
          # The responsive override therefore belongs to the persistent site base;
          # weakening the generator fixed-point oracle would hide a real lifecycle bug.
          test -s site/assets/newsletter-responsive-polish.css
          test ! -e release-src/assets/newsletter-responsive-polish.css
          grep -q 'assets/newsletter-responsive-polish.css' release-src/index.html

      - name: Freeze the edited canonical release source
        run: python tools/build_final_release.py

      - name: Assemble the exact public candidate
        run: |
          rm -rf publish
          cp -a site publish
          python tools/apply_final_release.py publish
          CANONICAL_HASH=$(python - <<'PY'
          import json
          print(json.load(open('release-overlay/final/manifest.json', encoding='utf-8'))['index_sha256'])
          PY
          )
          python tools/apply_curated_i18n.py publish "$CANONICAL_HASH"
          python tools/build_editorial_frontends.py --site publish
          python tools/finalize_editorial_frontends.py --site publish --refresh-manifest

      - name: Render language/runtime contracts
        run: python tests/oraculos/verificar_dom.py publish

      - name: Render responsive layout contracts across physical viewports
        run: python tests/oraculos/verificar_layout.py publish --json-out /tmp/fcmo-layout-qa.json

      - name: Attach current browser QA to release identity
        shell: python
        run: |
          from datetime import datetime, timezone
          from pathlib import Path
          import json

          manifest_path = Path('release-overlay/final/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          layout = json.loads(Path('/tmp/fcmo-layout-qa.json').read_text(encoding='utf-8'))
          assert layout['status'] == 'pass', layout

          # Footnote: legal/privacy/release policy is still enforced by the normal
          # release suite below. We record zero *browser-DOM legal* checks here
          # rather than carrying forward the 2026-09-02 count as if it were newly
          # measured. The eight existing DOM-oracle route/locale renders remain
          # the current curated-i18n browser checks.
          manifest['qa'] = {
              'tool': 'tests/oraculos/verificar_layout.py + tests/oraculos/verificar_dom.py',
              'measured_at': datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z'),
              'browser': layout['browser'],
              'viewport_widths': [row['width'] for row in layout['viewports']],
              'route_viewport_checks': layout['route_viewport_checks'],
              'javascript_failures': layout['javascript_failures'],
              'overflow_failures': layout['overflow_failures'],
              'blank_route_failures': layout['blank_route_failures'],
              'legal_dom_checks': 0,
              'i18n_dom_checks': 8,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

      - name: Regenerate measured public release receipt
        run: python tools/build_ready_receipt.py

      - name: Compile permanent layout oracle
        run: python -m py_compile tests/oraculos/verificar_layout.py

      - name: Run repository unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify frozen release identity
        run: python tools/build_final_release.py --check

      - name: Verify measured public receipt
        run: python tools/build_ready_receipt.py --check

      - name: Verify native localization completeness
        run: python tools/validate_localizations.py --site release-src

      - name: Re-render language/runtime contracts
        run: python tests/oraculos/verificar_dom.py publish

      - name: Re-render responsive layout contracts
        run: python tests/oraculos/verificar_layout.py publish

      - name: Commit the proved candidate back to the isolated branch
        run: |
          git config user.name "FCMO Visual Maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-src/index.html \
                  site/assets/newsletter-responsive-polish.css \
                  site/data/i18n/es-419/ui.json \
                  site/data/i18n/zh-Hans/ui.json \
                  release-overlay/final/manifest.json \
                  release-overlay/final/parts \
                  READY_TO_PUBLISH.md \
                  HANDOFF.md
          if git diff --cached --quiet; then
            echo "No migration diff produced" >&2
            exit 1
          fi
          # Footnote: only the approved canonical/UI/receipt artifacts are staged;
          # publish/ is a disposable proof tree and must never become source state.
          git commit -m "fix(web): polish responsive layout and repair thumbnail collisions"
          git push origin HEAD:visual/viewport-polish-2026-09-10
