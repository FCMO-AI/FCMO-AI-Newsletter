name: Protected publication validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    uses: ./.github/workflows/contract-tests.yml
    with:
      source_commit: ${{ github.sha }}

  publish-gate:
    name: publish-gate
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Cache pinned browser runtime
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/playwright/node_modules
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0-node-22-chromium-v1
      - name: Install pinned browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save playwright@1.63.0 axe-core@4.14.0
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/playwright/node_modules/playwright" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/playwright/node_modules" >> "$GITHUB_ENV"
          echo "AXE_CORE_PATH=$RUNNER_TEMP/playwright/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Install regression dependencies
        run: |
          python -m pip install PyYAML==6.0.2
          sudo apt-get update
          sudo apt-get install -y age

      - name: Run the full regression suite and validate the immutable candidate through every release and browser gate
        # The reusable unittest job checked this exact workflow commit in four
        # deterministic shards; ops/publish.py verifies the SHA before skipping
        # only that already-passed suite invocation.
        run: python3 ops/publish.py --check --tests-verified-commit "$GITHUB_SHA"
