name: One-shot ARB native-locale debt digest helper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-arb-native-locales-once.yml'

permissions:
  contents: read

concurrency:
  group: arb-native-locale-debt-repair
  cancel-in-progress: false

jobs:
  compute-public-digests:
    runs-on: ubuntu-latest
    steps:
      - name: Require GitHub App credentials
        env:
          APP_CLIENT_ID: ${{ vars.FCMO_NEWSWIRE_APP_CLIENT_ID }}
        run: test -n "$APP_CLIENT_ID"

      - name: Mint read-only token scoped only to private ARB
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FCMO_NEWSWIRE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FCMO_NEWSWIRE_APP_PRIVATE_KEY }}
          owner: FCMO-AI
          repositories: AI-Research-Breakthroughs
          permission-contents: read

      - name: Checkout current ARB main read-only
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/fcmo-arb-locale-repair"
          rm -rf "$D"
          AUTH=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth 1 --single-branch --branch main https://github.com/FCMO-AI/AI-Research-Breakthroughs.git "$D"
          unset AUTH APP_TOKEN

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exact declassified projection
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fcmo-arb-locale-repair"
          ARB_SITE_BASE_PATH=/FCMO-AI-Newsletter ARB_PUBLIC_BASE_URL=https://fcmo-ai.github.io/FCMO-AI-Newsletter python tools/build_publication.py --check-determinism
          python tools/build_public_release.py

      - name: Emit only public IDs and their exact translation digests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fcmo-arb-locale-repair"
          python - <<'PY'
          import json
          from tools.build_public_locales import digest, projection, read_release_rows
          wanted = {
            'FCMO-2E15FDD2C2B1','FCMO-DBCE0693D769','FCMO-34D01928C071',
            'FCMO-EEF757F0D806','FCMO-5D9E5184D0F0','FCMO-BA43DA5C5770',
            'FCMO-0462AE20C5CD','FCMO-549245C022B9','FCMO-07D3957AC2B9',
            'FCMO-28A16703D598','FCMO-FAD9D0AFD3E4','FCMO-BFDCA63E4D53',
            'FCMO-49180A73A8A0','FCMO-179D8B7D7D2D','FCMO-F63D7F3A70B9',
          }
          rows = read_release_rows()
          missing = sorted(wanted - set(rows))
          if missing:
              raise SystemExit(f'public rows missing: {missing}')
          print('PUBLIC_TRANSLATION_DIGESTS=' + json.dumps(
              {pid: digest(projection(rows[pid])) for pid in sorted(wanted)},
              sort_keys=True,
          ))
          PY

      - name: Destroy private checkout
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/fcmo-arb-locale-repair"
          test ! -e "$RUNNER_TEMP/fcmo-arb-locale-repair"
