name: One-shot ARB native-locale debt repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-arb-native-locales-once.yml'

permissions:
  contents: read

concurrency:
  group: arb-native-locale-debt-repair
  cancel-in-progress: false

jobs:
  stamp-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Require GitHub App credentials
        env:
          APP_CLIENT_ID: ${{ vars.FCMO_NEWSWIRE_APP_CLIENT_ID }}
        run: test -n "$APP_CLIENT_ID"

      - name: Mint token scoped only to private ARB
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FCMO_NEWSWIRE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FCMO_NEWSWIRE_APP_PRIVATE_KEY }}
          owner: FCMO-AI
          repositories: AI-Research-Breakthroughs
          permission-contents: write

      - name: Checkout private ARB
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/fcmo-arb-locale-repair"
          rm -rf "$D"
          AUTH=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth 1 --single-branch --branch main https://github.com/FCMO-AI/AI-Research-Breakthroughs.git "$D"
          cd "$D"
          git config user.name 'fcmo-newswire[bot]'
          git config user.email 'fcmo-newswire[bot]@users.noreply.github.com'
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          unset AUTH APP_TOKEN

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exact public projection then stamp all native records
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fcmo-arb-locale-repair"
          ARB_SITE_BASE_PATH=/FCMO-AI-Newsletter ARB_PUBLIC_BASE_URL=https://fcmo-ai.github.io/FCMO-AI-Newsletter python tools/build_publication.py --check-determinism
          python tools/build_public_release.py
          python tools/build_public_locales.py stamp es-419
          python tools/build_public_locales.py stamp zh-Hans

      - name: Fail unless only the two authorized debt fragments changed
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fcmo-arb-locale-repair"
          git diff --name-only | sort > "$RUNNER_TEMP/changed.txt"
          printf '%s\n' \
            'publication/locales/es-419/debt-2026-09-14.json' \
            'publication/locales/zh-Hans/debt-2026-09-14.json' | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"

      - name: Validate native airlock and debt coverage before persistence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fcmo-arb-locale-repair"
          python tools/build_public_locales.py build
          python tools/check_native_edition_coverage.py --recent-days 7

      - name: Commit the stamped fragments to ARB main
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fcmo-arb-locale-repair"
          git add publication/locales/es-419/debt-2026-09-14.json publication/locales/zh-Hans/debt-2026-09-14.json
          git diff --cached --check
          git commit -m 'locales: stamp and validate publication translation debt'
          git push origin HEAD:main

      - name: Destroy private checkout
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/fcmo-arb-locale-repair"
          test ! -e "$RUNNER_TEMP/fcmo-arb-locale-repair"
