name: Finalize newsletter handoff

on:
  push:
    branches: [prelaunch/finalize-newsletter-handoff-20260904]
    paths:
      - 'tools/finalize_newsletter_handoff.py'
      - '.github/workflows/finalize-handoff.yml'

permissions:
  contents: write

concurrency:
  group: finalize-newsletter-handoff
  cancel-in-progress: false

jobs:
  close-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic closure patch
        run: python tools/finalize_newsletter_handoff.py

      - name: Rebuild frozen release and public receipt
        run: |
          # Footnote: source changes and the frozen overlay are one atomic product;
          # committing only one side would deliberately fail the release identity gate.
          python tools/build_final_release.py
          python tools/build_ready_receipt.py

      - name: Run unit and growth/regression oracles
        run: |
          python -m unittest discover -s tests -v
          python tests/oraculos/verificar_generador.py
          python tests/oraculos/verificar_traduccion.py
          python tests/oraculos/verificar_refresco.py
          python tests/oraculos/verificar_traductor.py

      - name: Run the complete publication gates
        run: |
          python tools/build_final_release.py --check
          python tools/build_ready_receipt.py --check
          python tools/verify_release.py
          git diff --check

      - name: Remove one-shot machinery and commit the product
        shell: bash
        run: |
          # Footnote: these two files exist only to bridge this connector session
          # into a real checkout. They must not become permanent production surface.
          rm tools/finalize_newsletter_handoff.py .github/workflows/finalize-handoff.yml
          git add -A
          git config user.name 'FCMO Newsletter Closure'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Close newsletter handoff and eliminate historical-count drift'
          git push origin HEAD:prelaunch/finalize-newsletter-handoff-20260904
