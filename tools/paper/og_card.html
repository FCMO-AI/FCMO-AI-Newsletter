<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<style>
{{FONTS}}
*{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;overflow:hidden}body{position:relative;background:#0D0D0F;color:#F2EFE8;font-family:"Inter Tight",Arial,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
.plate{position:absolute;inset:0 0 104px 0}.plate svg{display:block;width:100%;height:100%}
.bar{position:absolute;inset:auto 0 0 0;height:104px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;background:#0D0D0F;border-top:2px solid #34343C}
.mark{margin-right:32px;white-space:nowrap;flex:none;display:flex;align-items:center;gap:18px;font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1}.sym{color:#F05A28;font:700 34px/1 "JetBrains Mono",monospace;letter-spacing:0}
.meta{white-space:nowrap;display:flex;align-items:center;gap:16px;font:400 18px/1 "JetBrains Mono",monospace;letter-spacing:.05em;text-transform:uppercase;color:#A9A69C}.meta b{color:#F2EFE8;font-weight:700}.dot{width:8px;height:8px;background:#F05A28}
html[lang="zh-Hans"] .meta{letter-spacing:0;text-transform:none;font-size:24px}
</style>
</head>
<body><div class="plate">{{PLATE}}</div><div class="bar"><div class="mark"><span class="sym">[^]</span><span>FCMO AI</span></div><div class="meta"><span>{{BEAT}}</span><i class="dot"></i><span>{{DATE}}</span><i class="dot"></i><b>{{EVIDENCE}}</b></div></div></body>
</html>
