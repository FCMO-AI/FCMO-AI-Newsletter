<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;overflow:hidden}body{position:relative;padding:58px 70px 52px;background:#F2EFE8;color:#0A0A0A;font-family:"Arial Narrow",Arial,sans-serif}.rule{position:absolute;inset:0 0 auto;height:12px;background:#0A0A0A}.accent{position:absolute;left:70px;top:0;width:150px;height:12px;background:#F05A28}.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:28px;border-bottom:2px solid #0A0A0A;font:700 24px/1 Arial,sans-serif;letter-spacing:-.02em}.mark{font-size:33px;font-weight:900}.mark b{color:#A9340E}.meta{font:400 17px/1.2 monospace;letter-spacing:.08em;text-transform:uppercase;color:#5E5A53}.body{display:grid;grid-template-columns:1fr 156px;gap:45px;align-items:end;height:430px}.beat{margin:0 0 16px;color:#A9340E;font:700 18px/1 monospace;letter-spacing:.09em;text-transform:uppercase}.headline{margin:0;max-width:900px;font-size:{{SIZE}}px;line-height:.93;letter-spacing:-.055em;font-weight:850;text-wrap:balance}.dek{margin:22px 0 0;max-width:860px;color:#34322F;font:400 24px/1.28 Georgia,serif}.glyph{align-self:stretch;border-left:1px solid #C9C2B6;display:flex;align-items:flex-end;justify-content:flex-end;color:#F05A28;font:900 120px/1 monospace}html[lang="zh-Hans"] .headline{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;line-height:1.04;letter-spacing:-.03em}html[lang="zh-Hans"] .dek{font-family:"Songti SC","Noto Serif CJK SC",serif;line-height:1.4}
</style>
</head>
<body><div class="rule"></div><div class="accent"></div><header class="top"><span class="mark"><b>[^]</b> FCMO AI</span><span class="meta">{{DATE}} · {{EVIDENCE}}</span></header><main class="body"><div><p class="beat">{{BEAT}}</p><h1 class="headline">{{HEADLINE}}</h1><p class="dek">{{DEK}}</p></div><div class="glyph">^</div></main></body>
</html>
